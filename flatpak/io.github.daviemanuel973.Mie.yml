app-id: io.github.daviemanuel973.Mie
default-branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ourcraft-flatpak

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: mie-survival
    buildsystem: simple
    build-commands:
      - cmake -S . -B build-flatpak -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DOURCRAFT_INSTALLABLE=ON -DOURCRAFT_ENABLE_AVX2=OFF -DOURCRAFT_LOW_END_BUILD=ON -DOURCRAFT_FLATPAK=ON
      - cmake --build build-flatpak --parallel "${FLATPAK_BUILDER_N_JOBS:-2}"
      - cmake --install build-flatpak
      - install -Dm755 flatpak/ourcraft-launcher.sh /app/bin/ourcraft-flatpak
      - install -Dm644 flatpak/io.github.daviemanuel973.Mie.desktop /app/share/applications/io.github.daviemanuel973.Mie.desktop
      - install -Dm644 flatpak/io.github.daviemanuel973.Mie.metainfo.xml /app/share/metainfo/io.github.daviemanuel973.Mie.metainfo.xml
      - install -Dm644 flatpak/io.github.daviemanuel973.Mie.svg /app/share/icons/hicolor/scalable/apps/io.github.daviemanuel973.Mie.svg
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build-flatpak
          - flatpak-repo
