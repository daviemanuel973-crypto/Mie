name: Persist Writable User Data Paths

on:
  push:
    branches:
      - agent/release-packaging-windows-fix
    paths:
      - '.github/workflows/persist-user-data-path-fix.yml'

permissions:
  contents: write

jobs:
  persist-path-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated packaging branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-windows-fix
          fetch-depth: 0

      - name: Separate read-only assets from writable user data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path_name, old, new, expected=None):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  if count == 0 and new in text:
                      return
                  raise SystemExit(f'{path_name}: expected {expected} occurrence(s) of {old!r}, found {count}')
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'{path_name}: neither old nor corrected form found: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_required(
              'CMakeLists.txt',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="resources/")\n\t\tset_target_properties',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="resources/")\n'
              '\t\ttarget_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC\n'
              '\t\t\tUSER_CONTENT_PATH="resources/"\n'
              '\t\t\tUSER_SETTINGS_PATH="playerSettings/"\n'
              '\t\t\tUSER_ERROR_LOG_PATH="errorLogs.txt")\n'
              '\t\tset_target_properties',
              1)
          replace_required(
              'CMakeLists.txt',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="${OURCRAFT_RESOURCE_DIR}")\n\t\tset_target_properties',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="${OURCRAFT_RESOURCE_DIR}")\n'
              '\t\ttarget_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC\n'
              '\t\t\tUSER_CONTENT_PATH="resources/"\n'
              '\t\t\tUSER_SETTINGS_PATH="playerSettings/"\n'
              '\t\t\tUSER_ERROR_LOG_PATH="errorLogs.txt")\n'
              '\t\tset_target_properties',
              1)
          replace_required(
              'CMakeLists.txt',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="${CMAKE_CURRENT_SOURCE_DIR}/resources/")\nendif()',
              'target_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC RESOURCES_PATH="${CMAKE_CURRENT_SOURCE_DIR}/resources/")\n'
              '\ttarget_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC\n'
              '\t\tUSER_CONTENT_PATH="${CMAKE_CURRENT_SOURCE_DIR}/resources/"\n'
              '\t\tUSER_SETTINGS_PATH="${CMAKE_CURRENT_SOURCE_DIR}/playerSettings/"\n'
              '\t\tUSER_ERROR_LOG_PATH="${CMAKE_CURRENT_SOURCE_DIR}/errorLogs.txt")\n'
              'endif()',
              1)

          replace_required('src/gameLayer/gameLayer.cpp', 'RESOURCES_PATH "../playerSettings/"', 'USER_SETTINGS_PATH', 1)
          replace_required('src/gameLayer/audioEngineRaudioBackend.cpp', 'RESOURCES_PATH "../playerSettings/soundSettings"', 'USER_SETTINGS_PATH "soundSettings"', 2)
          replace_required('src/gameLayer/errorReporting.cpp', 'RESOURCES_PATH "../errorLogs.txt"', 'USER_ERROR_LOG_PATH', 2)
          replace_required('src/gameLayer/rendering/renderSettings.cpp', 'RESOURCES_PATH "../playerSettings/renderSettings"', 'USER_SETTINGS_PATH "renderSettings"', 2)
          replace_required('src/gameLayer/rendering/renderSettings.cpp', 'RESOURCES_PATH "texturePacks"', 'USER_CONTENT_PATH "texturePacks"')
          replace_required('src/gameLayer/rendering/renderSettings.cpp', 'RESOURCES_PATH "skins"', 'USER_CONTENT_PATH "skins"')
          replace_required('src/gameLayer/rendering/renderSettings.cpp', 'RESOURCES_PATH "worlds/"', 'USER_CONTENT_PATH "worlds/"')
          replace_required('src/gameLayer/rendering/renderSettings.cpp', 'RESOURCES_PATH "worlds"', 'USER_CONTENT_PATH "worlds"')
          replace_required('src/gameLayer/multyPlayer/enetServerFunction.cpp', 'RESOURCES_PATH "worlds/"', 'USER_CONTENT_PATH "worlds/"')

          launcher_lines = [
              '#!/bin/sh',
              'set -eu',
              '',
              '# Flatpak maps XDG_DATA_HOME to ~/.var/app/<app-id>/data.',
              '# Engine assets stay read-only under /app; only user-editable content lives here.',
              'DATA_ROOT="${XDG_DATA_HOME:-$HOME/.local/share}/ourcraft"',
              'CONTENT_ROOT="$DATA_ROOT/resources"',
              'mkdir -p "$CONTENT_ROOT/worlds" "$DATA_ROOT/playerSettings"',
              '',
              'for name in texturePacks skins; do',
              '    src="/app/share/ourcraft/resources/$name"',
              '    dst="$CONTENT_ROOT/$name"',
              '    if [ -d "$src" ]; then',
              '        mkdir -p "$dst"',
              '        cp -a -n "$src/." "$dst/"',
              '    fi',
              'done',
              '',
              'cd "$DATA_ROOT"',
              '',
              '# CI can validate writable-data initialization without launching OpenGL.',
              'if [ "${1:-}" = "--prepare-data-only" ]; then',
              '    exit 0',
              'fi',
              '',
              'exec /app/bin/ourcraft "$@"',
          ]
          Path('flatpak/ourcraft-launcher.sh').write_text('\n'.join(launcher_lines) + '\n', encoding='utf-8')
          PY

      - name: Verify path separation
        shell: bash
        run: |
          grep -F 'USER_CONTENT_PATH="resources/"' CMakeLists.txt
          grep -F 'USER_SETTINGS_PATH="playerSettings/"' CMakeLists.txt
          grep -F 'USER_ERROR_LOG_PATH="errorLogs.txt"' CMakeLists.txt
          grep -F 'USER_CONTENT_PATH "worlds' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'USER_SETTINGS_PATH "renderSettings"' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'USER_CONTENT_PATH "worlds/' src/gameLayer/multyPlayer/enetServerFunction.cpp
          grep -F -- '--prepare-data-only' flatpak/ourcraft-launcher.sh

      - name: Commit writable-data fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt \
            src/gameLayer/gameLayer.cpp \
            src/gameLayer/audioEngineRaudioBackend.cpp \
            src/gameLayer/errorReporting.cpp \
            src/gameLayer/rendering/renderSettings.cpp \
            src/gameLayer/multyPlayer/enetServerFunction.cpp \
            flatpak/ourcraft-launcher.sh
          git commit -m 'fix: separate writable user data from packaged assets'
          git push origin HEAD:agent/release-packaging-windows-fix
