name: Exploration content applicator

on:
  push:
    branches:
      - "agent/content-exploration-v01"
    paths:
      - ".github/workflows/apply-exploration-content.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/content-exploration-v01"
          fetch-depth: 0
      - name: Apply content patch
        run: python3 .github/scripts/apply_exploration_content.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "Structure_Pyramid" src/gameLayer/worldGenerator.cpp
          grep -q "ZombieServer::Brute" src/gameLayer/multyPlayer/tick.cpp
          grep -q "hayBalde" src/gameLayer/gameplay/crafting.cpp
      - name: Commit content update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-exploration-content.yml
          rm .github/scripts/apply_exploration_content.py
          git add -A
          git commit -m "Add exploration content v0.1"
          git push origin agent/content-exploration-v01
