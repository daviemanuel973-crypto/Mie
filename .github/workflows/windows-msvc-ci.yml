name: Windows Release CI

on:
  push:
    branches:
      - main
      - agent/v0.7.2-stabilization
      - agent/content-exploration-v01
      - agent/release-packaging-stabilization
      - agent/release-packaging-windows-fix
      - agent/linux-nonbindless-renderer-fix
  pull_request:
    paths:
      - 'VERSION'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'shared/**'
      - 'resources/**'
      - 'windows/**'
      - '.github/workflows/windows-msvc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a semantic version, got: '$version'"
          }

          $cmake = Get-Content "CMakeLists.txt" -Raw
          if (-not $cmake.Contains("set(OURCRAFT_VERSION `"$version`"")) {
            throw "CMakeLists.txt version does not match VERSION ($version)"
          }

          $installer = Get-Content "windows/Mie.iss" -Raw
          if (-not $installer.Contains("#define MyAppVersion `"$version`"")) {
            throw "windows/Mie.iss version does not match VERSION ($version)"
          }

          "MIE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC Release
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DOURCRAFT_VERSION=$env:MIE_VERSION" `
            -DOURCRAFT_INSTALLABLE=ON `
            -DOURCRAFT_ENABLE_AVX2=OFF

      - name: Build MSVC Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test all Mie gameplay contracts
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60 -R '^(player-persistence-format|world-catalog|update-protocol|siege-director|world-difficulty|day-night-spawn-pressure|item-durability|native-systems|player-control-settings|entity-stats|survival-rules)$'

      - name: Stage portable Windows build
        shell: pwsh
        run: |
          Remove-Item stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force stage | Out-Null

          $exe = "build/Release/Mie.exe"
          if (-not (Test-Path $exe)) { throw "Release executable missing: $exe" }
          Copy-Item $exe "stage/Mie.exe"

          $launcher = "build/Release/MieLauncher.exe"
          if (-not (Test-Path $launcher)) { throw "Release launcher missing: $launcher" }
          Copy-Item $launcher "stage/MieLauncher.exe"
          Copy-Item "VERSION" "stage/VERSION.txt"

          if (-not (Test-Path "resources")) { throw "resources directory missing" }
          Copy-Item "resources" "stage/resources" -Recurse -Force
          Remove-Item "stage/resources/worlds" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "stage/resources/worlds" | Out-Null
          if (Test-Path "stage/playerSettings") { throw "portable package contains player settings" }
          if (Get-ChildItem "stage/resources/worlds" -Force) { throw "portable package contains world saves" }

          if (-not (Test-Path "stage/Mie.exe")) { throw "stage/Mie.exe missing" }
          if (-not (Test-Path "stage/MieLauncher.exe")) { throw "stage/MieLauncher.exe missing" }
          if (-not (Test-Path "stage/resources/assets")) { throw "staged assets missing" }
          if (-not (Test-Path "stage/resources/shaders")) { throw "staged shaders missing" }

      - name: Verify console-free Windows executables
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) { throw "Visual Studio C++ tools were not found" }
          $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC/Tools/MSVC") -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "x64 dumpbin.exe was not found" }

          $gameHeaders = (& $dumpbin.FullName /headers "stage/Mie.exe" 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for Mie.exe" }
          $launcherHeaders = (& $dumpbin.FullName /headers "stage/MieLauncher.exe" 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for MieLauncher.exe" }
          if ($gameHeaders -notmatch "Windows GUI") { throw "Mie.exe is not linked as a GUI application" }
          if ($launcherHeaders -notmatch "Windows GUI") { throw "MieLauncher.exe is not linked as a GUI application" }
          $launcherTest = Start-Process -FilePath "stage/MieLauncher.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($launcherTest.ExitCode -ne 0) { throw "MieLauncher self-test failed: $($launcherTest.ExitCode)" }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/Mie-Survival-Windows-x64-Portable.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "stage/*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "portable ZIP missing" }
          if ((Get-Item $zip).Length -le 0) { throw "portable ZIP is empty" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows setup executable
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=$env:MIE_VERSION" "windows/Mie.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/Mie-Survival-Windows-x64-Setup.exe")) { throw "setup executable missing" }

      - name: Smoke-test install, update and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist/Mie-Survival-Windows-x64-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "MieSmokeInstall"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "fresh install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$installDir/Mie.exe")) { throw "Mie.exe missing after install" }
          if (-not (Test-Path "$installDir/MieLauncher.exe")) { throw "MieLauncher.exe missing after install" }
          if (-not (Test-Path "$installDir/resources/shaders")) { throw "shader resources missing after install" }
          if ((Get-Content "$installDir/VERSION.txt" -Raw).Trim() -ne $env:MIE_VERSION) {
            throw "installed VERSION.txt does not match $env:MIE_VERSION"
          }

          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7B31E8F2-920D-49B9-81D8-2C2CFE9237AF}_is1"
          $displayVersion = (Get-ItemProperty -Path $uninstallKey -ErrorAction Stop).DisplayVersion
          if ($displayVersion -ne $env:MIE_VERSION) {
            throw "installer registered version '$displayVersion', expected '$env:MIE_VERSION'"
          }

          New-Item -ItemType Directory -Force "$installDir/resources/worlds/ci-preserve" | Out-Null
          Set-Content -Path "$installDir/resources/worlds/ci-preserve/save.txt" -Value "keep-me"
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "update install failed: $($p.ExitCode)" }
          if (-not (Test-Path "$installDir/resources/worlds/ci-preserve/save.txt")) { throw "update removed player save" }

          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "uninstaller missing" }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$installDir/Mie.exe") { throw "Mie.exe remained after uninstall" }
          if (-not (Test-Path "$installDir/resources/worlds/ci-preserve/save.txt")) { throw "uninstall deleted player-created save" }

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Windows-x64-Portable
          path: dist/Mie-Survival-Windows-x64-Portable.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Windows-x64-Setup
          path: dist/Mie-Survival-Windows-x64-Setup.exe
          if-no-files-found: error
