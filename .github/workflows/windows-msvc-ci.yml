name: Windows MSVC CI

on:
  push:
    branches:
      - agent/content-exploration-v01
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'shared/**'
      - 'resources/**'
      - '.github/workflows/windows-msvc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msvc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure MSVC Release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build MSVC Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
