name: Apply safe maintenance patch

on:
  push:
    branches:
      - agent/safe-maintenance
    paths:
      - '.github/workflows/apply-safe-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safe-maintenance

      - name: Apply grounded footstep guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/gameLayer/gamePlayLogic.cpp')
          text = path.read_text()
          old = "\t\t//player.entity.forces.colidesBottom() && \n\t\tif (isPlayerMovingSpeed)"
          new = "\t\tif (player.entity.forces.colidesBottom() && isPlayerMovingSpeed)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one B001 patch location, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/apply-safe-maintenance.yml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix grounded footstep playback'
          git push origin HEAD:agent/safe-maintenance
