name: v0.9.5 maintenance patch

on:
  push:
    branches:
      - agent/v0.9.5-stability
    paths:
      - '.github/workflows/v095-maintenance-patch.yml'

permissions:
  contents: write

jobs:
  patch-rollback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/v0.9.5-stability
          fetch-depth: 0

      - name: Replace assertion rollback with deterministic resync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/gameLayer/gamePlayLogic.cpp')
          text = path.read_text(encoding='utf-8')

          include_anchor = '#include "multyPlayer/undoQueue.h"\n'
          include_line = '#include "multyPlayer/interactionInvalidation.h"\n'
          if include_line not in text:
              if include_anchor not in text:
                  raise SystemExit('undoQueue include anchor not found')
              text = text.replace(include_anchor, include_anchor + include_line, 1)

          old_prefix = '''\t\t//undo stuff
\t\tif (inValidateRevision)
\t\t{
\t\t\tif (gameData.undoQueue.events.empty())
\t\t\t{
\t\t\t\tpermaAssert(0); // undo queue is empty but I revieved an undo message.
\t\t\t}

\t\t\tRevisionNumber currentRevisionNumber = gameData.undoQueue.events[0].eventId.revision;
\t\t\tfor (auto &i : gameData.undoQueue.events)
\t\t\t{
\t\t\t\tif (i.eventId.revision != currentRevisionNumber)
\t\t\t\t{
\t\t\t\t\tpermaAssert(0); // undo queue has inconsistent revisions
\t\t\t\t}
\t\t\t}

\t\t\tif (inValidateRevision != gameData.undoQueue.currentEventId.revision)
\t\t\t{
\t\t\t\tpermaAssert(0 && "inconsistency between the server's revision and mine"); //inconsistency between the server's revision and mine
\t\t\t}

\t\t\tfor (int i = gameData.undoQueue.events.size() - 1; i >= 0; i--)
\t\t\t{

\t\t\t\tauto &e = gameData.undoQueue.events[i];'''

          new_prefix = '''\t\t// Undo/revision resynchronisation. Delayed duplicate invalidations from a
\t\t// revision that was already handled are stale. Current/future authoritative
\t\t// invalidations roll back any remaining prediction and rebase the client.
\t\tif (inValidateRevision)
\t\t{
\t\t\tconst auto invalidationPlan = mie::network::planInteractionInvalidation(
\t\t\t\tinValidateRevision, gameData.undoQueue.currentEventId.revision);

\t\t\tif (invalidationPlan.apply)
\t\t\t{
\t\t\t\tfor (auto i = gameData.undoQueue.events.size(); i > 0; --i)
\t\t\t\t{

\t\t\t\t\tauto &e = gameData.undoQueue.events[i - 1];'''

          if old_prefix not in text:
              raise SystemExit('legacy rollback prefix not found exactly once')
          text = text.replace(old_prefix, new_prefix, 1)

          old_suffix = '''\t\t\tgameData.undoQueue.events.clear();

\t\t\tgameData.undoQueue.currentEventId.revision++;
\t\t}'''
          new_suffix = '''\t\t\t\tgameData.undoQueue.events.clear();
\t\t\t\tgameData.undoQueue.currentEventId.revision = invalidationPlan.nextRevision;
\t\t\t}
\t\t}'''

          if old_suffix not in text:
              raise SystemExit('legacy rollback suffix not found exactly once')
          text = text.replace(old_suffix, new_suffix, 1)

          forbidden = (
              'undo queue is empty but I revieved an undo message',
              'undo queue has inconsistent revisions',
              "inconsistency between the server's revision and mine",
          )
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'legacy assertion marker remains: {marker}')

          if 'planInteractionInvalidation(' not in text:
              raise SystemExit('new invalidation policy was not wired')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v095-maintenance-patch.yml
          git add src/gameLayer/gamePlayLogic.cpp
          git commit -m "net: harden delayed invalidation rollback"
          git push origin HEAD:agent/v0.9.5-stability
