name: Fix GCC Item Compatibility

on:
  push:
    branches:
      - agent/linux-lowend-performance
    paths:
      - .github/workflows/fix-gcc-items.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/linux-lowend-performance
          fetch-depth: 0
      - name: Fix legacy Item reset syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/gameLayer/gameplay/items.cpp')
          s = p.read_text()
          old = 'this->items[i] = {0};'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, 'this->items[i] = Item{};', 1))
          PY
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/gameplay/items.cpp
          git commit -m "Fix GCC item reset syntax"
          git push origin HEAD:agent/linux-lowend-performance
