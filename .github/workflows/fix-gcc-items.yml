name: Fix GCC Item Compatibility

on:
  push:
    branches:
      - agent/linux-lowend-performance
    paths:
      - .github/workflows/fix-gcc-items.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/linux-lowend-performance
          fetch-depth: 0
      - name: Fix legacy Item reset syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/gameLayer/gameplay/items.cpp')
          s = p.read_text()
          print('items.cpp lines:', len(s.splitlines()))
          for n, line in enumerate(s.splitlines(), 1):
              if 'items[' in line and '= {' in line:
                  print(f'candidate {n}: {line}')
          pattern = r'((?:this->)?items\s*\[[^\]]+\])\s*=\s*\{\s*0\s*\};'
          s2, count = re.subn(pattern, r'\1 = Item{};', s)
          if count == 0:
              raise RuntimeError('no legacy inventory slot reset found')
          print('replaced:', count)
          p.write_text(s2)
          PY
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/gameplay/items.cpp
          git commit -m "Fix GCC item reset syntax"
          git push origin HEAD:agent/linux-lowend-performance
