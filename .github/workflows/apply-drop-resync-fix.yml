name: Apply dropped-item resync fix

on:
  push:
    branches:
      - fix/v0.10-drop-rejection-inventory-resync
    paths:
      - .github/scripts/apply-drop-resync-fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.10-drop-rejection-inventory-resync
      - name: Apply minimal dropped-item resync fix
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply-drop-resync-fix.py
          git diff --check
      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/tick.cpp hardertodos.md
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "fix(multiplayer): resync inventory on stale dropped-item revision"
          git push origin HEAD:fix/v0.10-drop-rejection-inventory-resync
