name: Apply Linux Non-Bindless Renderer Fix

on:
  push:
    branches:
      - agent/linux-nonbindless-renderer-fix
    paths:
      - '.github/workflows/apply-linux-nonbindless-renderer-fix.yml'
      - 'tools/nonbindless_patch_source.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v6
        with:
          ref: agent/linux-nonbindless-renderer-fix

      - name: Extract and apply preserved patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('tools/nonbindless_patch_source.txt').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "cat > /tmp/apply_patch.py <<'PY'" in line)
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          body = textwrap.dedent('\n'.join(source[start + 1:end])) + '\n'
          Path('/tmp/apply_patch.py').write_text(body)
          PY
          python3 /tmp/apply_patch.py
          git diff --check

      - name: Commit compatibility renderer
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "Virgil_Hawkings"
          git config user.email "daviemanuel973@gmail.com"
          git add CMakeLists.txt flatpak include src resources
          git commit -m "fix: add non-bindless Linux renderer and graphics presets"
          git push origin HEAD:agent/linux-nonbindless-renderer-fix
