name: Apply Linux Non-Bindless Renderer Fix

on:
  push:
    branches:
      - agent/linux-nonbindless-renderer-fix
    paths:
      - '.github/workflows/apply-linux-nonbindless-renderer-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v6
        with:
          ref: agent/linux-nonbindless-renderer-fix

      - name: Apply texture-array renderer and quality presets
        shell: bash
        run: |
          cat > /tmp/apply_patch.py <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          # CMake: expose Flatpak-specific renderer compatibility define.
          p = 'CMakeLists.txt'
          s = read(p)
          if 'option(OURCRAFT_FLATPAK' not in s:
              s = replace_once(s,
                  'option(OURCRAFT_LOW_END_BUILD "Tune runtime defaults for low-end Linux hardware" OFF)\n',
                  'option(OURCRAFT_LOW_END_BUILD "Tune runtime defaults for low-end Linux hardware" OFF)\noption(OURCRAFT_FLATPAK "Enable Flatpak runtime compatibility renderer" OFF)\n',
                  'cmake flatpak option')
          if 'PUBLIC OURCRAFT_FLATPAK=1' not in s:
              marker = '# The original Windows-oriented source relies on a few declarations being\n'
              addition = 'if (OURCRAFT_FLATPAK)\n\ttarget_compile_definitions("${CMAKE_PROJECT_NAME}" PUBLIC OURCRAFT_FLATPAK=1)\nendif()\n\n'
              s = replace_once(s, marker, addition + marker, 'cmake flatpak define')
          write(p, s)

          # Flatpak manifest must actually enable the compatibility compile path.
          p = 'flatpak/io.github.daviemanuel973.Mie.yml'
          s = read(p)
          old = '-DOURCRAFT_INSTALLABLE=ON -DOURCRAFT_ENABLE_AVX2=OFF -DOURCRAFT_LOW_END_BUILD=ON'
          if '-DOURCRAFT_FLATPAK=ON' not in s:
              s = replace_once(s, old, old + ' -DOURCRAFT_FLATPAK=ON', 'manifest flatpak define')
          write(p, s)

          # Stop forcing Zink: the new renderer no longer needs bindless textures on Flatpak.
          p = 'flatpak/ourcraft-launcher.sh'
          s = read(p)
          start = '# The renderer relies on GL_ARB_bindless_texture for block/entity texture handles.\n'
          end = 'echo "Mie: OpenGL backend override=${MESA_LOADER_DRIVER_OVERRIDE}, ZINK_DESCRIPTORS=${ZINK_DESCRIPTORS}" >&2\n\n'
          if start in s:
              a = s.index(start)
              b = s.index(end, a) + len(end)
              s = s[:a] + 'echo "Mie: Flatpak texture-array compatibility renderer enabled" >&2\n\n' + s[b:]
          write(p, s)

          # BlocksLoader gets a conventional texture-array mirror of all block texture layers.
          p = 'include/gameLayer/blocksLoader.h'
          s = read(p)
          if 'compatibilityTextureArray' not in s:
              s = replace_once(s,
                  '\tstd::vector<GLuint> texturesIds;\n',
                  '\tstd::vector<GLuint> texturesIds;\n\n\tGLuint compatibilityTextureArray = 0;\n\tint compatibilityTextureArraySize = 128;\n\tvoid rebuildCompatibilityTextureArray(int targetSize = 128);\n',
                  'blocks header array')
          write(p, s)

          p = 'src/gameLayer/blocksLoader.cpp'
          s = read(p)
          if 'void BlocksLoader::rebuildCompatibilityTextureArray' not in s:
              marker = '//textureloader texture loader\nvoid BlocksLoader::loadAllTextures'
              code = r'''static std::vector<unsigned char> resizeBlockTextureNearestCompat(GLuint textureId, int targetSize)
          {
              gl2d::Texture sourceTexture;
              sourceTexture.id = textureId;
              glm::ivec2 sourceSize = {};
              auto source = sourceTexture.readTextureData(0, &sourceSize);

              std::vector<unsigned char> result((size_t)targetSize * targetSize * 4, 255);
              if (sourceSize.x <= 0 || sourceSize.y <= 0 || source.size() < (size_t)sourceSize.x * sourceSize.y * 4)
              {
                  for (int y = 0; y < targetSize; y++)
                  for (int x = 0; x < targetSize; x++)
                  {
                      size_t d = ((size_t)x + (size_t)y * targetSize) * 4;
                      bool dark = ((x / 8) + (y / 8)) % 2 == 0;
                      result[d + 0] = dark ? 0 : 146;
                      result[d + 1] = dark ? 0 : 52;
                      result[d + 2] = dark ? 0 : 235;
                      result[d + 3] = 255;
                  }
                  return result;
              }

              for (int y = 0; y < targetSize; y++)
              for (int x = 0; x < targetSize; x++)
              {
                  int sx = std::min(sourceSize.x - 1, (x * sourceSize.x) / targetSize);
                  int sy = std::min(sourceSize.y - 1, (y * sourceSize.y) / targetSize);
                  size_t src = ((size_t)sx + (size_t)sy * sourceSize.x) * 4;
                  size_t dst = ((size_t)x + (size_t)y * targetSize) * 4;
                  result[dst + 0] = source[src + 0];
                  result[dst + 1] = source[src + 1];
                  result[dst + 2] = source[src + 2];
                  result[dst + 3] = source[src + 3];
              }
              return result;
          }

          void BlocksLoader::rebuildCompatibilityTextureArray(int targetSize)
          {
              if (compatibilityTextureArray)
              {
                  glDeleteTextures(1, &compatibilityTextureArray);
                  compatibilityTextureArray = 0;
              }
              if (texturesIds.empty()) return;

              compatibilityTextureArraySize = std::max(16, targetSize);
              int mipLevels = 1;
              for (int size = compatibilityTextureArraySize; size > 1; size /= 2) mipLevels++;

              glGenTextures(1, &compatibilityTextureArray);
              glActiveTexture(GL_TEXTURE0 + 15);
              glBindTexture(GL_TEXTURE_2D_ARRAY, compatibilityTextureArray);
              glTexStorage3D(GL_TEXTURE_2D_ARRAY, mipLevels, GL_RGBA8,
                  compatibilityTextureArraySize, compatibilityTextureArraySize,
                  static_cast<GLsizei>(texturesIds.size()));
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);

              for (size_t layer = 0; layer < texturesIds.size(); layer++)
              {
                  auto data = resizeBlockTextureNearestCompat(texturesIds[layer], compatibilityTextureArraySize);
                  glTexSubImage3D(GL_TEXTURE_2D_ARRAY, 0, 0, 0, static_cast<GLint>(layer),
                      compatibilityTextureArraySize, compatibilityTextureArraySize, 1,
                      GL_RGBA, GL_UNSIGNED_BYTE, data.data());
              }

              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_MIN_FILTER, GL_NEAREST_MIPMAP_NEAREST);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_WRAP_S, GL_REPEAT);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_WRAP_T, GL_REPEAT);
              glGenerateMipmap(GL_TEXTURE_2D_ARRAY);
              glActiveTexture(GL_TEXTURE0);
          }

          //textureloader texture loader
          void BlocksLoader::loadAllTextures'''
              s = replace_once(s, marker, code, 'blocks array implementation')

          if 'rebuildCompatibilityTextureArray(128);' not in s:
              s = replace_once(s,
                  '\n}\n\nvoid BlocksLoader::setupAllColors()\n',
                  '\n#if defined(OURCRAFT_FLATPAK)\n\trebuildCompatibilityTextureArray(128);\n#endif\n}\n\nvoid BlocksLoader::setupAllColors()\n',
                  'blocks array rebuild call')

          if 'glDeleteTextures(1, &compatibilityTextureArray);' in s and s.count('compatibilityTextureArray = 0;') < 2:
              pass
          clear_marker = '\tblocksColors.clear();\n\n\tspawnEgg.cleanup();\n'
          if '#if defined(OURCRAFT_FLATPAK)\n\tif (compatibilityTextureArray)' not in s:
              s = replace_once(s, clear_marker,
                  '\tblocksColors.clear();\n\n#if defined(OURCRAFT_FLATPAK)\n\tif (compatibilityTextureArray)\n\t{\n\t\tglDeleteTextures(1, &compatibilityTextureArray);\n\t\tcompatibilityTextureArray = 0;\n\t}\n#endif\n\n\tspawnEgg.cleanup();\n',
                  'blocks array cleanup')
          write(p, s)

          # Models get their own conventional texture array for mobs/player model materials.
          p = 'include/gameLayer/rendering/model.h'
          s = read(p)
          if 'compatibilityTextureArray' not in s:
              s = replace_once(s,
                  '\tstd::vector<GLuint> texturesIds;\n\n\tGLuint texturesSSBO = 0;\n',
                  '\tstd::vector<GLuint> texturesIds;\n\n\tGLuint compatibilityTextureArray = 0;\n\tint compatibilityTextureArraySize = PLAYER_SKIN_SIZE;\n\tint compatibilityHandTextureLayer = 0;\n\tvoid rebuildCompatibilityTextureArray(int targetSize = PLAYER_SKIN_SIZE);\n\n\tGLuint texturesSSBO = 0;\n',
                  'models header array')
          write(p, s)

          p = 'src/gameLayer/rendering/model.cpp'
          s = read(p)
          if 'void ModelsManager::rebuildCompatibilityTextureArray' not in s:
              marker = 'void ModelsManager::loadAllModels(std::string path, bool reportErrors)\n'
              code = r'''static std::vector<unsigned char> resizeModelTextureNearestCompat(GLuint textureId, int targetSize)
          {
              gl2d::Texture sourceTexture;
              sourceTexture.id = textureId;
              glm::ivec2 sourceSize = {};
              auto source = sourceTexture.readTextureData(0, &sourceSize);
              std::vector<unsigned char> result((size_t)targetSize * targetSize * 4, 255);
              if (sourceSize.x <= 0 || sourceSize.y <= 0 || source.size() < (size_t)sourceSize.x * sourceSize.y * 4)
                  return result;

              for (int y = 0; y < targetSize; y++)
              for (int x = 0; x < targetSize; x++)
              {
                  int sx = std::min(sourceSize.x - 1, (x * sourceSize.x) / targetSize);
                  int sy = std::min(sourceSize.y - 1, (y * sourceSize.y) / targetSize);
                  size_t src = ((size_t)sx + (size_t)sy * sourceSize.x) * 4;
                  size_t dst = ((size_t)x + (size_t)y * targetSize) * 4;
                  result[dst + 0] = source[src + 0];
                  result[dst + 1] = source[src + 1];
                  result[dst + 2] = source[src + 2];
                  result[dst + 3] = source[src + 3];
              }
              return result;
          }

          void ModelsManager::rebuildCompatibilityTextureArray(int targetSize)
          {
              if (compatibilityTextureArray)
              {
                  glDeleteTextures(1, &compatibilityTextureArray);
                  compatibilityTextureArray = 0;
              }
              if (texturesIds.empty()) return;

              compatibilityTextureArraySize = std::max(16, targetSize);
              compatibilityHandTextureLayer = static_cast<int>(texturesIds.size());
              int layers = compatibilityHandTextureLayer + 1;
              int mipLevels = 1;
              for (int size = compatibilityTextureArraySize; size > 1; size /= 2) mipLevels++;

              glGenTextures(1, &compatibilityTextureArray);
              glActiveTexture(GL_TEXTURE0 + 16);
              glBindTexture(GL_TEXTURE_2D_ARRAY, compatibilityTextureArray);
              glTexStorage3D(GL_TEXTURE_2D_ARRAY, mipLevels, GL_RGBA8,
                  compatibilityTextureArraySize, compatibilityTextureArraySize, layers);

              for (int layer = 0; layer < compatibilityHandTextureLayer; layer++)
              {
                  auto data = resizeModelTextureNearestCompat(texturesIds[layer], compatibilityTextureArraySize);
                  glTexSubImage3D(GL_TEXTURE_2D_ARRAY, 0, 0, 0, layer,
                      compatibilityTextureArraySize, compatibilityTextureArraySize, 1,
                      GL_RGBA, GL_UNSIGNED_BYTE, data.data());
              }

              auto hand = resizeModelTextureNearestCompat(temporaryPlayerHandTexture.id, compatibilityTextureArraySize);
              glTexSubImage3D(GL_TEXTURE_2D_ARRAY, 0, 0, 0, compatibilityHandTextureLayer,
                  compatibilityTextureArraySize, compatibilityTextureArraySize, 1,
                  GL_RGBA, GL_UNSIGNED_BYTE, hand.data());

              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_MIN_FILTER, GL_NEAREST_MIPMAP_NEAREST);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_WRAP_S, GL_REPEAT);
              glTexParameteri(GL_TEXTURE_2D_ARRAY, GL_TEXTURE_WRAP_T, GL_REPEAT);
              glGenerateMipmap(GL_TEXTURE_2D_ARRAY);
              glActiveTexture(GL_TEXTURE0);
          }

          void ModelsManager::loadAllModels(std::string path, bool reportErrors)
'''
              s = replace_once(s, marker, code, 'model array implementation')

          if 'rebuildCompatibilityTextureArray(PLAYER_SKIN_SIZE);' not in s:
              s = replace_once(s,
                  '\tsetupSSBO();\n}\n\n\n//gets the block shape\n',
                  '#if defined(OURCRAFT_FLATPAK)\n\trebuildCompatibilityTextureArray(PLAYER_SKIN_SIZE);\n#endif\n\tsetupSSBO();\n}\n\n\n//gets the block shape\n',
                  'model array rebuild call')

          if '#if defined(OURCRAFT_FLATPAK)\n\tif (compatibilityTextureArray)' not in s:
              s = replace_once(s,
                  '\ttexturesIds.clear();\n\tgpuIds.clear();\n\n}\n\nvoid ModelsManager::setupSSBO()\n',
                  '#if defined(OURCRAFT_FLATPAK)\n\tif (compatibilityTextureArray)\n\t{\n\t\tglDeleteTextures(1, &compatibilityTextureArray);\n\t\tcompatibilityTextureArray = 0;\n\t}\n#endif\n\n\ttexturesIds.clear();\n\tgpuIds.clear();\n\n}\n\nvoid ModelsManager::setupSSBO()\n',
                  'model array cleanup')
          write(p, s)

          # Main block vertex shader keeps original bindless path on Windows and passes layer index on Flatpak.
          p = 'resources/shaders/rendering/defaultShader.vert'
          s = read(p)
          if 'v_compatTextureIndex' not in s:
              s = replace_once(s,
                  'out flat uvec2 v_paralaxSampler;\n',
                  'out flat uvec2 v_paralaxSampler;\nout flat int v_compatTextureIndex;\n',
                  'default vert compat output')
              old = '''\tv_textureSampler = textureSamplerers[textureIndex];\n\tv_normalSampler = textureSamplerers[textureIndex+1];\n\tv_materialSampler = textureSamplerers[textureIndex+2];\n\tv_paralaxSampler = textureSamplerers[textureIndex+3];\n'''
              new = '''#ifdef MIE_COMPAT_TEXTURES\n\tv_compatTextureIndex = textureIndex;\n\tv_textureSampler = uvec2(0);\n\tv_normalSampler = uvec2(0);\n\tv_materialSampler = uvec2(0);\n\tv_paralaxSampler = uvec2(0);\n#else\n\tv_compatTextureIndex = 0;\n\tv_textureSampler = textureSamplerers[textureIndex];\n\tv_normalSampler = textureSamplerers[textureIndex+1];\n\tv_materialSampler = textureSamplerers[textureIndex+2];\n\tv_paralaxSampler = textureSamplerers[textureIndex+3];\n#endif\n'''
              s = replace_once(s, old, new, 'default vert sampler select')
          write(p, s)

          # Main fragment shader samples texture-array layers in Flatpak mode.
          p = 'resources/shaders/rendering/defaultShader.frag'
          s = read(p)
          if '#ifndef MIE_COMPAT_TEXTURES\n#extension GL_ARB_bindless_texture: require' not in s:
              s = replace_once(s,
                  '#extension GL_ARB_bindless_texture: require\n',
                  '#ifndef MIE_COMPAT_TEXTURES\n#extension GL_ARB_bindless_texture: require\n#endif\n',
                  'default frag extension')
          if 'sampleBlockAlbedo' not in s:
              marker = 'in flat uvec2 v_paralaxSampler;\n'
              helper = r'''in flat uvec2 v_paralaxSampler;

          #ifdef MIE_COMPAT_TEXTURES
          in flat int v_compatTextureIndex;
          uniform sampler2DArray u_compatTextureArray;
          vec4 sampleBlockAlbedo(vec2 uv) { return texture(u_compatTextureArray, vec3(uv, float(v_compatTextureIndex))); }
          vec4 sampleBlockNormal(vec2 uv) { return texture(u_compatTextureArray, vec3(uv, float(v_compatTextureIndex + 1))); }
          vec4 sampleBlockMaterial(vec2 uv) { return texture(u_compatTextureArray, vec3(uv, float(v_compatTextureIndex + 2))); }
          vec4 sampleBlockParallax(vec2 uv) { return texture(u_compatTextureArray, vec3(uv, float(v_compatTextureIndex + 3))); }
          #else
          vec4 sampleBlockAlbedo(vec2 uv) { return texture(sampler2D(v_textureSampler), uv); }
          vec4 sampleBlockNormal(vec2 uv) { return texture(sampler2D(v_normalSampler), uv); }
          vec4 sampleBlockMaterial(vec2 uv) { return texture(sampler2D(v_materialSampler), uv); }
          vec4 sampleBlockParallax(vec2 uv) { return texture(sampler2D(v_paralaxSampler), uv); }
          #endif
'''
              s = replace_once(s, marker, helper, 'default frag helpers')
          s = s.replace('texture(sampler2D(v_normalSampler), uv)', 'sampleBlockNormal(uv)')
          s = s.replace('texture(sampler2D(v_textureSampler), v_uv)', 'sampleBlockAlbedo(v_uv)')
          s = s.replace('texture(sampler2D(v_textureSampler), finalUV)', 'sampleBlockAlbedo(finalUV)')
          s = s.replace('texture(sampler2D(v_materialSampler), finalUV)', 'sampleBlockMaterial(finalUV)')
          s = s.replace('texture(sampler2D(v_paralaxSampler), UVs)', 'sampleBlockParallax(UVs)')
          s = s.replace('texture(sampler2D(v_paralaxSampler), prevTexCoords)', 'sampleBlockParallax(prevTexCoords)')
          write(p, s)

          # Depth pre-pass follows the same layer index.
          p = 'resources/shaders/rendering/zpass.vert'
          s = read(p)
          if 'v_compatTextureIndex' not in s:
              s = replace_once(s, 'out flat uvec2 v_textureSampler;\n', 'out flat uvec2 v_textureSampler;\nout flat int v_compatTextureIndex;\n', 'zpass compat output')
              s = replace_once(s,
                  '\t\tv_textureSampler = uvec2(0,0);\n\t\treturn;\n',
                  '\t\tv_textureSampler = uvec2(0,0);\n\t\tv_compatTextureIndex = 0;\n\t\treturn;\n',
                  'zpass early return')
              s = replace_once(s,
                  '\tint textureIndex = in_textureIndex & 0x07FF;\n\tv_textureSampler = textureSamplerers[textureIndex];\n',
                  '\tint textureIndex = in_textureIndex & 0x07FF;\n#ifdef MIE_COMPAT_TEXTURES\n\tv_compatTextureIndex = textureIndex;\n\tv_textureSampler = uvec2(0);\n#else\n\tv_compatTextureIndex = 0;\n\tv_textureSampler = textureSamplerers[textureIndex];\n#endif\n',
                  'zpass texture select')
          write(p, s)

          p = 'resources/shaders/rendering/zpass.frag'
          s = read(p)
          if '#ifndef MIE_COMPAT_TEXTURES' not in s:
              s = replace_once(s, '#extension GL_ARB_bindless_texture: require\n', '#ifndef MIE_COMPAT_TEXTURES\n#extension GL_ARB_bindless_texture: require\n#endif\n', 'zpass extension')
              s = replace_once(s, 'in flat uvec2 v_textureSampler;\nin vec2 v_uv;\n', 'in flat uvec2 v_textureSampler;\nin flat int v_compatTextureIndex;\nin vec2 v_uv;\n#ifdef MIE_COMPAT_TEXTURES\nuniform sampler2DArray u_compatTextureArray;\n#endif\n', 'zpass inputs')
              s = replace_once(s,
                  '\tfloat a = texture(sampler2D(v_textureSampler), v_uv).a;\n',
                  '#ifdef MIE_COMPAT_TEXTURES\n\tfloat a = texture(u_compatTextureArray, vec3(v_uv, float(v_compatTextureIndex))).a;\n#else\n\tfloat a = texture(sampler2D(v_textureSampler), v_uv).a;\n#endif\n',
                  'zpass sample')
          write(p, s)

          # Shaders that use ordinary sampler uniforms only need bindless disabled in compat mode.
          for p in ['resources/shaders/rendering/decal.frag', 'resources/shaders/renderBlockUi.frag', 'resources/shaders/blockEntity.frag', 'resources/shaders/itemEntity.frag']:
              s = read(p)
              if '#extension GL_ARB_bindless_texture: require' in s and '#ifndef MIE_COMPAT_TEXTURES' not in s:
                  s = s.replace('#extension GL_ARB_bindless_texture: require\n', '#ifndef MIE_COMPAT_TEXTURES\n#extension GL_ARB_bindless_texture: require\n#endif\n', 1)
              write(p, s)

          # Animated entity shader: array layer is stored in the low 32 bits of existing texture fields.
          p = 'resources/shaders/basicEntity.vert'
          s = read(p)
          if 'v_compatTextureIndex' not in s:
              s = replace_once(s, 'flat out uvec2 v_textureSampler;\n', 'flat out uvec2 v_textureSampler;\nflat out int v_compatTextureIndex;\n', 'basic entity output')
              old = '''\tif(textureIndex == 1)\t{v_textureSampler = entityData[gl_InstanceID].textureSampler1;} else\n\tif(textureIndex == 2)\t{v_textureSampler = entityData[gl_InstanceID].textureSampler2;} else\n\tif(textureIndex == 3)\t{v_textureSampler = entityData[gl_InstanceID].textureSampler3;} else\n\t\t\t\t\t\t\t{v_textureSampler = entityData[gl_InstanceID].textureSampler0;} \n'''
              new = '''\tuvec2 selectedTextureSampler = entityData[gl_InstanceID].textureSampler0;\n\tif(textureIndex == 1) selectedTextureSampler = entityData[gl_InstanceID].textureSampler1; else\n\tif(textureIndex == 2) selectedTextureSampler = entityData[gl_InstanceID].textureSampler2; else\n\tif(textureIndex == 3) selectedTextureSampler = entityData[gl_InstanceID].textureSampler3;\n#ifdef MIE_COMPAT_TEXTURES\n\tv_compatTextureIndex = int(selectedTextureSampler.x);\n\tv_textureSampler = uvec2(0);\n#else\n\tv_compatTextureIndex = 0;\n\tv_textureSampler = selectedTextureSampler;\n#endif\n'''
              s = replace_once(s, old, new, 'basic entity texture select')
          write(p, s)

          p = 'resources/shaders/basicEntity.frag'
          s = read(p)
          if '#ifndef MIE_COMPAT_TEXTURES' not in s:
              s = replace_once(s, '#extension GL_ARB_bindless_texture: require\n', '#ifndef MIE_COMPAT_TEXTURES\n#extension GL_ARB_bindless_texture: require\n#endif\n', 'basic entity extension')
              s = replace_once(s, 'flat in uvec2 v_textureSampler;\n', 'flat in uvec2 v_textureSampler;\nflat in int v_compatTextureIndex;\n#ifdef MIE_COMPAT_TEXTURES\nuniform sampler2DArray u_compatTextureArray;\n#endif\n', 'basic entity compat input')
              s = replace_once(s,
                  '\tcolor.rgba = texture(sampler2D(v_textureSampler), v_uv).rgba;\n',
                  '#ifdef MIE_COMPAT_TEXTURES\n\tcolor.rgba = texture(u_compatTextureArray, vec3(v_uv, float(v_compatTextureIndex))).rgba;\n#else\n\tcolor.rgba = texture(sampler2D(v_textureSampler), v_uv).rgba;\n#endif\n',
                  'basic entity sample')
          write(p, s)

          # Renderer structures expose compatibility array samplers.
          p = 'include/gameLayer/rendering/renderer.h'
          s = read(p)
          if 'uniform u_compatTextureArray' not in s:
              s = replace_once(s, '\t\tuniform u_texture = -1;\n\t\tuniform u_time = -1;\n', '\t\tuniform u_texture = -1;\n\t\tuniform u_compatTextureArray = -1;\n\t\tuniform u_time = -1;\n', 'default shader compat uniform')
              s = replace_once(s, '\t\tGLuint u_textureSamplerers;\n\t\tGLuint u_renderOnlyWater;\n', '\t\tGLuint u_textureSamplerers;\n\t\tuniform u_compatTextureArray = -1;\n\t\tGLuint u_renderOnlyWater;\n', 'zpass compat uniform')
              s = replace_once(s, '\t\t\tuniform u_exposure;\n\n\t\t\tGLuint u_skinningMatrix', '\t\t\tuniform u_exposure;\n\t\t\tuniform u_compatTextureArray = -1;\n\n\t\t\tGLuint u_skinningMatrix', 'entity compat uniform')
          write(p, s)

          # Renderer implementation: compile compat shader variants and bind conventional arrays.
          p = 'src/gameLayer/rendering/renderer.cpp'
          s = read(p)
          if '#define MIE_COMPAT_TEXTURES 1' not in s:
              s = replace_once(s,
                  '\tstd::string defines = getShadingSettings().formatIntoGLSLcode();\n',
                  '\tstd::string defines = getShadingSettings().formatIntoGLSLcode();\n#if defined(OURCRAFT_FLATPAK)\n\tdefines += "\\n#define MIE_COMPAT_TEXTURES 1\\n";\n#endif\n',
                  'renderer shader compat define')

          # Make all renderer shaders that share compat conditionals receive the define.
          s = s.replace('renderUIBlocksShader.shader.loadShaderProgramFromFile(RESOURCES_PATH "shaders/renderBlockUi.vert",\n\t\t\tRESOURCES_PATH "shaders/renderBlockUi.frag");', 'renderUIBlocksShader.shader.loadShaderProgramFromFileAndAddCode(RESOURCES_PATH "shaders/renderBlockUi.vert",\n\t\t\tRESOURCES_PATH "shaders/renderBlockUi.frag", defines.c_str());')
          s = s.replace('zpassShader.shader.loadShaderProgramFromFile(RESOURCES_PATH "shaders/rendering/zpass.vert",\n\t\t\tRESOURCES_PATH "shaders/rendering/zpass.frag");', 'zpassShader.shader.loadShaderProgramFromFileAndAddCode(RESOURCES_PATH "shaders/rendering/zpass.vert",\n\t\t\tRESOURCES_PATH "shaders/rendering/zpass.frag", defines.c_str());')
