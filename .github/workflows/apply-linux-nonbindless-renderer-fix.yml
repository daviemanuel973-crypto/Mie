                  case 3: return "Ultra";
                  default: return "Custom";
              }
          }

          int getRecommendedGraphicsPreset()
          {
              const char *rendererNameRaw = reinterpret_cast<const char *>(glGetString(GL_RENDERER));
              std::string rendererName = rendererNameRaw ? rendererNameRaw : "";
              std::transform(rendererName.begin(), rendererName.end(), rendererName.begin(),
                  [](unsigned char c) { return static_cast<char>(std::tolower(c)); });

              GLint maxTextureSize = 0;
              glGetIntegerv(GL_MAX_TEXTURE_SIZE, &maxTextureSize);

              if (rendererName.find("llvmpipe") != std::string::npos ||
                  rendererName.find("softpipe") != std::string::npos ||
                  rendererName.find("software") != std::string::npos)
                  return 0;

              if (rendererName.find("intel") != std::string::npos)
              {
                  if (rendererName.find("hd graphics") != std::string::npos ||
                      rendererName.find("uhd graphics") != std::string::npos)
                      return 0;
                  return 1;
              }

              if (maxTextureSize > 0 && maxTextureSize < 8192) return 0;
              if (rendererName.find("nvidia") != std::string::npos ||
                  rendererName.find("geforce") != std::string::npos ||
                  rendererName.find("radeon") != std::string::npos ||
                  rendererName.find("amd") != std::string::npos)
                  return 2;
              return 1;
          }

          void applyGraphicsPreset(ProgramData &programData, int preset)
          {
              preset = glm::clamp(preset, 0, 3);
              auto &settings = getShadingSettings();

              programData.renderer.frustumCulling = true;
              programData.renderer.sortChunks = true;
              settings.useLights = 1;
              settings.FXAA = 1;

              if (preset == 0)
              {
                  settings.viewDistance = 5;
                  settings.lodStrength = 5;
                  settings.workerThreadsForBaking = 1;
                  settings.shadows = 0;
                  settings.waterType = 0;
                  settings.PBR = 0;
                  settings.SSR = 0;
                  settings.bloom = 0;
                  settings.bloomMultiplier = 0.f;
                  settings.maxLights = 8;
                  programData.renderer.ssao = false;
                  programData.renderer.fxaaData.ITERATIONS = 6;
                  programData.renderer.fxaaData.quaityMultiplier = 0.65f;
                  programData.renderer.fxaaData.SUBPIXEL_QUALITY = 0.60f;
              }
              else if (preset == 1)
              {
                  settings.viewDistance = 8;
                  settings.lodStrength = 3;
                  settings.workerThreadsForBaking = 2;
                  settings.shadows = 1;
                  settings.waterType = 0;
                  settings.PBR = 0;
                  settings.SSR = 0;
                  settings.bloom = 0;
                  settings.bloomMultiplier = 0.f;
                  settings.maxLights = 16;
                  programData.renderer.ssao = false;
                  programData.renderer.fxaaData.ITERATIONS = 8;
                  programData.renderer.fxaaData.quaityMultiplier = 0.72f;
                  programData.renderer.fxaaData.SUBPIXEL_QUALITY = 0.70f;
              }
              else if (preset == 2)
              {
                  settings.viewDistance = 12;
                  settings.lodStrength = 2;
                  settings.workerThreadsForBaking = 3;
                  settings.shadows = 1;
                  settings.waterType = 1;
                  settings.PBR = 1;
                  settings.SSR = 0;
                  settings.bloom = 1;
                  settings.bloomMultiplier = 0.45f;
                  settings.maxLights = 32;
                  programData.renderer.ssao = true;
                  programData.renderer.fxaaData.ITERATIONS = 10;
                  programData.renderer.fxaaData.quaityMultiplier = 0.78f;
                  programData.renderer.fxaaData.SUBPIXEL_QUALITY = 0.85f;
              }
              else
              {
                  settings.viewDistance = 18;
                  settings.lodStrength = 1;
                  settings.workerThreadsForBaking = 4;
                  settings.shadows = 2;
                  settings.waterType = 1;
                  settings.PBR = 1;
                  settings.SSR = 1;
                  settings.bloom = 1;
                  settings.bloomMultiplier = 0.60f;
                  settings.maxLights = 48;
                  programData.renderer.ssao = true;
                  programData.renderer.fxaaData.ITERATIONS = 12;
                  programData.renderer.fxaaData.quaityMultiplier = 0.8f;
                  programData.renderer.fxaaData.SUBPIXEL_QUALITY = 0.95f;
              }

              settings.normalize();
              saveShadingSettings();
          }

          void applyLowEndPerformancePreset(ProgramData &programData)
'''
              s = replace_once(s, marker, code, 'preset implementation')

              # Simplify old low-end implementation to the canonical Low preset.
              pattern = re.compile(r'void applyLowEndPerformancePreset\(ProgramData &programData\)\n\{.*?\n\}\n\nvoid displayRenderSettingsMenu', re.S)
              replacement = '''void applyLowEndPerformancePreset(ProgramData &programData)\n{\n\tapplyGraphicsPreset(programData, 0);\n}\n\nvoid displayRenderSettingsMenu'''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('could not canonicalize low-end preset')

          if 'Recommended for this GPU:' not in s:
              old_menu = '''\tprogramData.ui.menuRenderer.Text("Rendering Settings...", Colors_White);\n\n\tif (programData.ui.menuRenderer.Button("Performance preset (Intel HD / low-end)", Colors_Gray,\n\t\tprogramData.ui.buttonTexture))\n\t{\n\t\tapplyLowEndPerformancePreset(programData);\n\t}\n'''
              new_menu = '''\tprogramData.ui.menuRenderer.Text("Rendering Settings...", Colors_White);\n\n\tconst int recommendedPreset = getRecommendedGraphicsPreset();\n\tstd::string recommendation = std::string("Recommended for this GPU: ") + getGraphicsPresetName(recommendedPreset);\n\tprogramData.ui.menuRenderer.Text(recommendation.c_str(), Colors_White);\n\tif (programData.ui.menuRenderer.Button("Apply recommended graphics", Colors_Gray, programData.ui.buttonTexture))\n\t\tapplyGraphicsPreset(programData, recommendedPreset);\n\tif (programData.ui.menuRenderer.Button("Graphics: Low", Colors_Gray, programData.ui.buttonTexture))\n\t\tapplyGraphicsPreset(programData, 0);\n\tif (programData.ui.menuRenderer.Button("Graphics: Medium", Colors_Gray, programData.ui.buttonTexture))\n\t\tapplyGraphicsPreset(programData, 1);\n\tif (programData.ui.menuRenderer.Button("Graphics: High", Colors_Gray, programData.ui.buttonTexture))\n\t\tapplyGraphicsPreset(programData, 2);\n\tif (programData.ui.menuRenderer.Button("Graphics: Ultra", Colors_Gray, programData.ui.buttonTexture))\n\t\tapplyGraphicsPreset(programData, 3);\n\tprogramData.ui.menuRenderer.Text("You can still tune every option below manually.", Colors_Gray);\n'''
              s = replace_once(s, old_menu, new_menu, 'graphics menu')
          write(p, s)

          # Static validation of the intended compatibility path.
          checks = {
              'CMakeLists.txt': ['OURCRAFT_FLATPAK=1'],
              'flatpak/io.github.daviemanuel973.Mie.yml': ['-DOURCRAFT_FLATPAK=ON'],
              'src/gameLayer/blocksLoader.cpp': ['rebuildCompatibilityTextureArray(128)', 'GL_TEXTURE_2D_ARRAY'],
              'src/gameLayer/rendering/model.cpp': ['compatibilityHandTextureLayer', 'GL_TEXTURE_2D_ARRAY'],
              'resources/shaders/rendering/defaultShader.frag': ['sampler2DArray u_compatTextureArray', 'sampleBlockAlbedo'],
              'resources/shaders/rendering/zpass.frag': ['sampler2DArray u_compatTextureArray'],
              'resources/shaders/basicEntity.frag': ['sampler2DArray u_compatTextureArray'],
              'src/gameLayer/rendering/renderSettings.cpp': ['Recommended for this GPU:', 'Graphics: Ultra'],
          }
          for path, needles in checks.items():
              data = read(path)
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f'{path}: missing {needle}')
          PY
          python3 /tmp/apply_patch.py
          git diff --check

      - name: Commit compatibility renderer
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "Virgil_Hawkings"
          git config user.email "daviemanuel973@gmail.com"
          git add CMakeLists.txt flatpak include src resources
          git commit -m "fix: add non-bindless Linux renderer and graphics presets"
          git push origin HEAD:agent/linux-nonbindless-renderer-fix
