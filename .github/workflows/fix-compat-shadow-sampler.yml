name: Fix Compatibility Shadow Sampler

on:
  push:
    branches:
      - agent/linux-nonbindless-renderer-fix
    paths:
      - '.github/workflows/fix-compat-shadow-sampler.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/linux-nonbindless-renderer-fix
      - name: Fix GLSL shadow sampler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/shaders/rendering/defaultShader.frag')
          s = p.read_text()
          old = 'float depth = texture(sampler2D(u_cascadedShadowsMaps[cascade]), pos.xy).r;'
          new = 'float depth = texture(u_cascadedShadowsMaps[cascade], pos.xy).r;'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy sampler constructor, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          ! grep -F 'sampler2D(u_cascadedShadowsMaps' resources/shaders/rendering/defaultShader.frag
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Virgil_Hawkings"
          git config user.email "daviemanuel973@gmail.com"
          git add resources/shaders/rendering/defaultShader.frag
          git commit -m "fix: use regular sampler array for compatibility shadows"
          git push origin HEAD:agent/linux-nonbindless-renderer-fix
