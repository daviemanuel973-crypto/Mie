name: v0.9.5 Version Sync

on:
  push:
    branches:
      - agent/v0.9.5-stability
    paths:
      - '.github/workflows/v095-version-sync.yml'

permissions:
  contents: write

jobs:
  sync-release-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v6
        with:
          ref: agent/v0.9.5-stability
          fetch-depth: 0

      - name: Synchronize release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          old = 'set(OURCRAFT_VERSION "0.9.4" CACHE STRING "Mie Survival release version")'
          new = 'set(OURCRAFT_VERSION "0.9.5" CACHE STRING "Mie Survival release version")'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'CMakeLists.txt version anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          cmake.write_text(text)

          installer = Path('windows/Mie.iss')
          text = installer.read_text()
          old = '#define MyAppVersion "0.9.4"'
          new = '#define MyAppVersion "0.9.5"'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'windows/Mie.iss version anchor mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          installer.write_text(text)
          PY

          test "$(tr -d '\r\n' < VERSION)" = '0.9.5'
          grep -F 'set(OURCRAFT_VERSION "0.9.5"' CMakeLists.txt
          grep -F '#define MyAppVersion "0.9.5"' windows/Mie.iss
          git diff --check

      - name: Commit version synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt windows/Mie.iss
          git commit -m 'fix: synchronize v0.9.5 release metadata'
          git push origin HEAD:agent/v0.9.5-stability
