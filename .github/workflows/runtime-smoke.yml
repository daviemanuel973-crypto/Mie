name: Runtime Smoke

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'shared/**'
      - 'resources/**'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-server-client-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libzstd-dev

      - name: Configure low-end native build
        run: |
          cmake -S . -B build-runtime-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOURCRAFT_ENABLE_AVX2=OFF \
            -DOURCRAFT_LOW_END_BUILD=ON \
            -DBUILD_TESTING=OFF

      - name: Build Mie
        run: cmake --build build-runtime-smoke --target ourCraft --parallel 2

      - name: Run real server/client/world smoke twice
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            log="runtime-smoke-${attempt}.log"
            rm -rf resources/worlds/__mie_runtime_smoke__
            MIE_RUNTIME_SMOKE_TEST=1 \
            MIE_FRAME_LIMIT=30 \
            MESA_LOADER_DRIVER_OVERRIDE=zink \
            LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' \
              ./build-runtime-smoke/ourCraft 2>&1 | tee "${log}"
            test ! -e resources/worlds/__mie_runtime_smoke__
            grep -F '[runtime-smoke] PASS:' "${log}"
          done

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-failure-log
          path: runtime-smoke-*.log
          if-no-files-found: warn
          retention-days: 3
