LootTable &ZombieServer::getLootTable()
{
	switch (variant)
	{
	case Runner: return zombieRunnerLootTable;
	case Brute: return zombieBruteLootTable;
	case Walker:
	default: return zombieWalkerLootTable;
	}
}
'''
          path.write_text(text[:pos] + zombie_tail)

          # Add deterministic goblin Common/Warrior/Chief variants. The Chief is a
          # rare roaming miniboss until the procedural camp generation lands.
          path = Path('src/gameLayer/gameplay/goblin.cpp')
          text = path.read_text()
          append_anchor = '''void GoblinServer::appendDataToDisk(std::ofstream &f, std::uint64_t eId)\n{\n}\n'''
          configure_code = append_anchor + r'''
static unsigned int getGoblinVariantRoll(std::uint64_t eId)
{
