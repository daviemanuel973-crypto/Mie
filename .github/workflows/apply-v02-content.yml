'''
          text = replace_once(text, append_anchor, configure_code, 'goblin variant configuration')

          update_anchor = '''{\n\tBasicEnemyBehaviourOtherSettings settings;\n\tsettings.hearBonus = -0.1;\n\n\n\tbasicEnemyBehaviour.update(this, deltaTime, chunkGetter, serverChunkStorer, rng, yourEID, othersDeleted,'''
          update_replacement = '''{\n\tconfigureVariant(yourEID);\n\n\tBasicEnemyBehaviourOtherSettings settings;\n\tsettings.hearBonus = -0.1f;\n\tsettings.runSpeed = 2.f * moveSpeedMultiplier;\n\tsettings.searchDistance = 38.f;\n\n\tif (variant == Warrior)\n\t{\n\t\tsettings.hearBonus = 0.f;\n\t\tsettings.searchDistance = 44.f;\n\t}\n\telse if (variant == Chief)\n\t{\n\t\tsettings.hearBonus = 0.12f;\n\t\tsettings.sightBonus = 0.18f;\n\t\tsettings.searchDistance = 52.f;\n\t}\n\n\tbasicEnemyBehaviour.update(this, deltaTime, chunkGetter, serverChunkStorer, rng, yourEID, othersDeleted,'''
          text = replace_once(text, update_anchor, update_replacement, 'goblin update settings')

          stats_marker = 'WeaponStats GoblinServer::getWeaponStats()'
          stats_pos = text.find(stats_marker)
          if stats_pos < 0:
              raise SystemExit('missing goblin stats anchor')
          goblin_tail = r'''WeaponStats GoblinServer::getWeaponStats()
{
