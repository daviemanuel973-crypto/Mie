name: Apply item-use validation include

on:
  push:
    branches:
      - fix/v0.10-item-use-transaction
    paths:
      - .github/scripts/apply-item-use-validation-include.py
      - .github/workflows/apply-item-use-validation-include.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.10-item-use-transaction
          fetch-depth: 0
      - name: Apply missing include and self-clean
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply-item-use-validation-include.py
          git diff --check
      - name: Commit and push clean patch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(multiplayer): include item-use validation policy"
          git push origin HEAD:fix/v0.10-item-use-transaction
