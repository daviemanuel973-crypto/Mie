name: Apply v0.9.3.1 guarded hotfix

on:
  push:
    branches:
      - agent/v0.9.3.1-data-integrity
    paths:
      - tools/apply_v0931_hotfix.py
      - .github/workflows/apply-v0931-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.3.1-data-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded source patch
        run: python tools/apply_v0931_hotfix.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit hotfix source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CMakeLists.txt VERSION README.md windows/Mie.iss \
            docs/V0.9.3.1_DATA_INTEGRITY.md \
            include/gameLayer/multyPlayer/dataIntegrity.h \
            include/gameLayer/multyPlayer/chunkSaver.h \
            src/gameLayer/multyPlayer/chunkSaver.cpp \
            src/gameLayer/multyPlayer/serverChunkStorer.cpp \
            src/gameLayer/multyPlayer/enetServerFunction.cpp \
            src/gameLayer/multyPlayer/tick.cpp \
            tests/survivalRulesTests.cpp
          git commit -m "v0.9.3.1: harden persistence and entity integrity"
          git push origin HEAD:agent/v0.9.3.1-data-integrity
