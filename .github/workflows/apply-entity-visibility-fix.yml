name: Apply entity visibility fix

on:
  push:
    branches:
      - "fix/v0.10-entity-chunk-visibility"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused streaming/rendering fix
        run: python3 .github/scripts/apply_entity_visibility_fix.py

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(rendering): hide entities until chunks are renderable"
          git push origin HEAD:fix/v0.10-entity-chunk-visibility
