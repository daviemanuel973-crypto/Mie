name: Patch crafting inventory crash v0.9.1

on:
  push:
    branches:
      - fix/crafting-inventory-crash-v0.9.1
    paths:
      - '.github/workflows/patch-crafting-inventory-crash-v091.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/crafting-inventory-crash-v0.9.1
          fetch-depth: 0

      - name: Apply bounds-safe crafting selection hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path('src/gameLayer/rendering/UiEngine.cpp')
          text = ui.read_text()

          anchor = '#include <gameplay/crafting.h>\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '#include <gameplay/craftingUiSelection.h>\n', 1)

          old = "\t\t\t\t\t\t\t\tint currentPos = craftingSlider;\n\t\t\t\t\t\t\t\tcraftingSlider -= platform::getScroll();\n\t\t\t\t\t\t\t\tint minVal = 0;\n\t\t\t\t\t\t\t\tif (allItems.size() <= itemsRowCount-2)\n\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\tminVal = -(allItems.size() - 2);\n\t\t\t\t\t\t\t\t}\n\n\t\t\t\t\t\t\t\tcraftingSlider = glm::clamp(craftingSlider, -1, std::max((int)allItems.size() - 2, minVal));\n\n\t\t\t\t\t\t\t\tif (currentPos != craftingSlider && platform::getScroll())\n"
          new = "\t\t\t\t\t\t\t\tint currentPos = craftingSlider;\n\t\t\t\t\t\t\t\tconst int scrollDelta = platform::getScroll();\n\t\t\t\t\t\t\t\tcraftingSlider = CraftingUiSelection::clampSlider(\n\t\t\t\t\t\t\t\t\tcraftingSlider - scrollDelta, static_cast<int>(allItems.size()));\n\n\t\t\t\t\t\t\t\tif (currentPos != craftingSlider && scrollDelta)\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '\t\t\t\t\t\t\t\t\tif (allItems.size() > i)\n'
          new = '\t\t\t\t\t\t\t\t\tif (CraftingUiSelection::isValidRecipeIndex(i, static_cast<int>(allItems.size())))\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '\t\t\t\t\t\t\t\tint start = craftingSlider;\n\n\t\t\t\t\t\t\t\tstd::optional<int> currentIndexSelected;\n'
          new = '\t\t\t\t\t\t\t\tint start = craftingSlider;\n\t\t\t\t\t\t\t\tconst int selectedRecipeIndex = CraftingUiSelection::selectedRecipeIndex(\n\t\t\t\t\t\t\t\t\tcraftingSlider, static_cast<int>(allItems.size()));\n\n\t\t\t\t\t\t\t\tstd::optional<int> currentIndexSelected;\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '\t\t\t\t\t\t\t\t\t\tcurrentItemHovered = allItems[start + 1].recepie.result;\n'
          new = '\t\t\t\t\t\t\t\t\t\tif (selectedRecipeIndex >= 0)\n\t\t\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\t\t\tcurrentItemHovered = allItems[selectedRecipeIndex].recepie.result;\n\t\t\t\t\t\t\t\t\t\t}\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '\t\t\t\t\t\t\t\t\t\tif (allItems.size() > start + 1)\n\t\t\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\t\t\toutCraftingRecepieGlobalIndex = allItems[start + 1].index;\n\t\t\t\t\t\t\t\t\t\t}\n'
          new = '\t\t\t\t\t\t\t\t\t\tif (selectedRecipeIndex >= 0)\n\t\t\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\t\t\toutCraftingRecepieGlobalIndex = allItems[selectedRecipeIndex].index;\n\t\t\t\t\t\t\t\t\t\t}\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '\t\t\t\t\t\t\t\tdoOneRender(start + 1, {0,1,1,1});\n'
          new = '\t\t\t\t\t\t\t\tif (selectedRecipeIndex >= 0)\n\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\tdoOneRender(selectedRecipeIndex, {0,1,1,1});\n\t\t\t\t\t\t\t\t}\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          pattern = re.compile(r'\t\t\t\t\t\t\t\t\t\tcraftingSlider -= \(start \+ 1\) - \*currentIndexSelected;\n\n\t\t\t\t\t\t\t\t\t\tint minVal = 0;\n\t\t\t\t\t\t\t\t\t\tif \(allItems\.size\(\) <= 7\)\n\t\t\t\t\t\t\t\t\t\t\{\n\t\t\t\t\t\t\t\t\t\t\tminVal = -\(allItems\.size\(\) - 2\);\n\t\t\t\t\t\t\t\t\t\t\}\n\t\t\t\t\t\t\t\t\t\tcraftingSlider = glm::clamp\(craftingSlider, -1, std::max\(\(int\)allItems\.size\(\) \+ 7 - 9, minVal\)\);')
          replacement = '\t\t\t\t\t\t\t\t\t\tcraftingSlider -= (start + 1) - *currentIndexSelected;\n\t\t\t\t\t\t\t\t\t\tcraftingSlider = CraftingUiSelection::clampSlider(\n\t\t\t\t\t\t\t\t\t\t\tcraftingSlider, static_cast<int>(allItems.size()));'
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1

          old = '\t\t\t\t\t\t\t\t\tint index = craftingSlider + 1;\n\n\t\t\t\t\t\t\t\t\tif (allItems.size() > index)\n'
          new = '\t\t\t\t\t\t\t\t\tint index = CraftingUiSelection::selectedRecipeIndex(\n\t\t\t\t\t\t\t\t\t\tcraftingSlider, static_cast<int>(allItems.size()));\n\n\t\t\t\t\t\t\t\t\tif (CraftingUiSelection::isValidRecipeIndex(index, static_cast<int>(allItems.size())))\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          ui.write_text(text)

          header = "#pragma once\n\nnamespace CraftingUiSelection\n{\n\tinline int clampSlider(int slider, int recipeCount)\n\t{\n\t\tif (recipeCount <= 0) { return -1; }\n\t\tconst int maxSlider = recipeCount > 1 ? recipeCount - 2 : -1;\n\t\tif (slider < -1) { return -1; }\n\t\tif (slider > maxSlider) { return maxSlider; }\n\t\treturn slider;\n\t}\n\n\tinline bool isValidRecipeIndex(int index, int recipeCount)\n\t{\n\t\treturn index >= 0 && index < recipeCount;\n\t}\n\n\tinline int selectedRecipeIndex(int slider, int recipeCount)\n\t{\n\t\tif (recipeCount <= 0) { return -1; }\n\t\tconst int index = clampSlider(slider, recipeCount) + 1;\n\t\treturn isValidRecipeIndex(index, recipeCount) ? index : -1;\n\t}\n}\n"
          Path('include/gameLayer/gameplay/craftingUiSelection.h').write_text(header)

          test = "#include <gameplay/craftingUiSelection.h>\n#include <cassert>\n#include <iostream>\n\nint main()\n{\n\tusing namespace CraftingUiSelection;\n\tassert(clampSlider(0, 0) == -1);\n\tassert(selectedRecipeIndex(0, 0) == -1);\n\tassert(clampSlider(0, 1) == -1);\n\tassert(clampSlider(100, 1) == -1);\n\tassert(selectedRecipeIndex(0, 1) == 0);\n\tassert(selectedRecipeIndex(100, 1) == 0);\n\tassert(!isValidRecipeIndex(-1, 1));\n\tassert(isValidRecipeIndex(0, 1));\n\tassert(!isValidRecipeIndex(1, 1));\n\tassert(clampSlider(-50, 2) == -1);\n\tassert(clampSlider(0, 2) == 0);\n\tassert(clampSlider(50, 2) == 0);\n\tassert(selectedRecipeIndex(-1, 2) == 0);\n\tassert(selectedRecipeIndex(0, 2) == 1);\n\tassert(clampSlider(100, 8) == 6);\n\tassert(selectedRecipeIndex(100, 8) == 7);\n\tstd::cout << \"crafting UI selection bounds: ok\\n\";\n\treturn 0;\n}\n"
          Path('tests/craftingUiSelectionTests.cpp').write_text(test)

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          old = 'set(OURCRAFT_VERSION "0.9.0" CACHE STRING "Mie Survival semantic version")'
          assert text.count(old) == 1
          text = text.replace(old, 'set(OURCRAFT_VERSION "0.9.1" CACHE STRING "Mie Survival semantic version")', 1)
          anchor = '\tadd_executable(farmingTests\n'
          addition = '\tadd_executable(craftingUiSelectionTests\n\t\ttests/craftingUiSelectionTests.cpp)\n\ttarget_include_directories(craftingUiSelectionTests PRIVATE\n\t\t"${CMAKE_CURRENT_SOURCE_DIR}/include/gameLayer/")\n\tadd_test(NAME crafting-ui-selection COMMAND craftingUiSelectionTests)\n\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition + anchor, 1)
          anchor = '\t\trecipe-book-discovery\n\t\tfarming-persistence\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '\t\trecipe-book-discovery\n\t\tcrafting-ui-selection\n\t\tfarming-persistence\n', 1)
          cmake.write_text(text)

          Path('VERSION').write_text('0.9.1\n')
          iss = Path('windows/Mie.iss')
          text = iss.read_text()
          assert text.count('#define MyAppVersion "0.9.0"') == 1
          iss.write_text(text.replace('#define MyAppVersion "0.9.0"', '#define MyAppVersion "0.9.1"', 1))

          windows_ci = Path('.github/workflows/windows-msvc-ci.yml')
          text = windows_ci.read_text()
          anchor = '|recipe-book-discovery|farming-persistence)$\''
          assert text.count(anchor) == 1
          windows_ci.write_text(text.replace(anchor, '|recipe-book-discovery|crafting-ui-selection|farming-persistence)$\'', 1))

          publish = Path('.github/workflows/publish-windows-release.yml')
          text = publish.read_text()
          anchor = '|recipe-book-discovery)$\''
          assert text.count(anchor) == 1
          publish.write_text(text.replace(anchor, '|recipe-book-discovery|crafting-ui-selection)$\'', 1))

          linux_ci = Path('.github/workflows/linux-flatpak-ci.yml')
          text = linux_ci.read_text()
          anchor = '          ./recipeBookTests\n\n          # Farming pulls in GLM'
          addition = '          ./recipeBookTests\n\n          c++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -pedantic \\\n            -Iinclude/gameLayer \\\n            tests/craftingUiSelectionTests.cpp \\\n            -o craftingUiSelectionTests\n          ./craftingUiSelectionTests\n\n          # Farming pulls in GLM'
          assert text.count(anchor) == 1
          linux_ci.write_text(text.replace(anchor, addition, 1))

          Path('.github/workflows/patch-crafting-inventory-crash-v091.yml').unlink()
          PY

          git diff --check
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Iinclude/gameLayer tests/craftingUiSelectionTests.cpp -o /tmp/crafting-ui-selection
          /tmp/crafting-ui-selection
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Mie Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prevent crafting inventory single-recipe crash'
          git push origin HEAD:fix/crafting-inventory-crash-v0.9.1
