name: Publish Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Publish Windows Release must run from an existing vX.Y.Z or vX.Y.Z.W tag"
          }
          $sourceVersion = (Get-Content "VERSION" -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?([+-][0-9A-Za-z.-]+)?$') {
            throw "Invalid supported release version: $version"
          }
          if ($sourceVersion -ne $version) {
            throw "VERSION ($sourceVersion) does not match release tag ($tag)"
          }
          "MIE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC Release
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DOURCRAFT_INSTALLABLE=ON `
            -DOURCRAFT_LOW_END_BUILD=ON `
            -DOURCRAFT_ENABLE_AVX2=OFF `
            "-DOURCRAFT_VERSION=$env:MIE_VERSION"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure --timeout 60 -R '^(player-persistence-format|world-catalog|update-protocol|siege-director|world-difficulty|day-night-spawn-pressure|item-durability|native-systems|player-control-settings|entity-stats|survival-rules|furnace-recipes|furnace-block-runtime|recipe-discovery-persistence|recipe-book-discovery|farming-persistence|entity-id-allocator|runtime-foundation|packet-validation)$'

      - name: Stage Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item "build/Release/Mie.exe" "stage/Mie.exe"
          Copy-Item "build/Release/MieLauncher.exe" "stage/MieLauncher.exe"
          Copy-Item "VERSION" "stage/VERSION.txt"
          Copy-Item "resources" "stage/resources" -Recurse -Force
          Remove-Item "stage/resources/worlds" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "stage/resources/worlds" | Out-Null
          if (Test-Path "stage/playerSettings") { throw "portable package contains player settings" }
          if (Get-ChildItem "stage/resources/worlds" -Force) { throw "portable package contains world saves" }
          Compress-Archive -Path "stage/*" -DestinationPath "dist/Mie-Survival-Windows-x64-Portable.zip" -CompressionLevel Optimal

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and checksums
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=$env:MIE_VERSION" "windows/Mie.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $installer = "dist/Mie-Survival-Windows-x64-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer is missing" }
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  Mie-Survival-Windows-x64-Setup.exe" |
            Set-Content "$installer.sha256" -Encoding ascii -NoNewline
          $portable = "dist/Mie-Survival-Windows-x64-Portable.zip"
          if (-not (Test-Path $portable)) { throw "Windows portable ZIP is missing" }
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  Mie-Survival-Windows-x64-Portable.zip" |
            Set-Content "$portable.sha256" -Encoding ascii -NoNewline

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:MIE_TAG" `
            "dist/Mie-Survival-Windows-x64-Setup.exe" `
            "dist/Mie-Survival-Windows-x64-Setup.exe.sha256" `
            "dist/Mie-Survival-Windows-x64-Portable.zip" `
            "dist/Mie-Survival-Windows-x64-Portable.zip.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Mie Survival $env:MIE_TAG"
