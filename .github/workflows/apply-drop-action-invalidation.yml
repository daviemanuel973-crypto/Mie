name: Apply dropped-item action invalidation

on:
  push:
    branches:
      - fix/v0.10-drop-stale-action-invalidation
    paths:
      - .github/scripts/apply-drop-action-invalidation.py
      - .github/workflows/apply-drop-action-invalidation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.10-drop-stale-action-invalidation
      - name: Apply targeted stale drop invalidation fix
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply-drop-action-invalidation.py
          git diff --check
      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/tick.cpp
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "fix(multiplayer): invalidate stale dropped-item prediction"
          git push origin HEAD:fix/v0.10-drop-stale-action-invalidation
