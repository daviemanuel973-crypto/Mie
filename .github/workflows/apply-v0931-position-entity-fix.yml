name: Apply v0.9.3.1 position-entity fix

on:
  push:
    branches:
      - agent/v0.9.3.1-data-integrity
    paths:
      - tools/apply_v0931_position_entity_fix.py
      - .github/workflows/apply-v0931-position-entity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.9.3.1-data-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded source patch
        run: python tools/apply_v0931_position_entity_fix.py
      - name: Validate source diff
        run: |
          git diff --check
          grep -F 'if constexpr (hasPositionBasedID<EntityValue>)' src/gameLayer/multyPlayer/tick.cpp
          grep -F 'const glm::ivec2 newChunk = determineChunkThatIsEntityIn(e.second.getPosition());' src/gameLayer/multyPlayer/tick.cpp
      - name: Commit source fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/tick.cpp
          git rm tools/apply_v0931_position_entity_fix.py .github/workflows/apply-v0931-position-entity-fix.yml
          git commit -m "fix: keep position-based entities out of chunk migration"
          git push origin HEAD:agent/v0.9.3.1-data-integrity
