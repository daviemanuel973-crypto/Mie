name: Apply v0.9.6 revision resync

on:
  push:
    branches:
      - codex/v0.9.6-stability-skins
    paths:
      - tools/apply_v096_revision_resync.py

permissions:
  contents: write

jobs:
  apply-revision-resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.9.6-stability-skins
          fetch-depth: 0

      - name: Apply guarded lag resync patch
        run: python3 tools/apply_v096_revision_resync.py

      - name: Verify authoritative rejection paths
        run: |
          git diff --check
          grep -F 'resyncInventoryAndCurrentInteraction(*client);' src/gameLayer/multyPlayer/tick.cpp
          grep -F 'client->playerData.inventory.revisionNumber != i.t.revisionNumber' src/gameLayer/multyPlayer/tick.cpp

      - name: Commit authoritative lag resync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/tick.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(v0.9.6): resync stale inventory operations under lag"
          git push origin HEAD:codex/v0.9.6-stability-skins
