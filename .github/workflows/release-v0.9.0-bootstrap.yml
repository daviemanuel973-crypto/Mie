name: Bootstrap v0.9.0 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.9.0-bootstrap.yml'

permissions:
  actions: read
  contents: write

jobs:
  release-v0-9-0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged release source
        uses: actions/checkout@v6
        with:
          ref: d52d689f433699a5184a01e7e68acc9c28bf18a1

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.0"
          test "$(git rev-parse HEAD)" = "d52d689f433699a5184a01e7e68acc9c28bf18a1"

      - name: Create v0.9.0 tag on validated merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.9.0" >/dev/null 2>&1; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.9.0" --jq '.object.sha')"
            test "$existing" = "d52d689f433699a5184a01e7e68acc9c28bf18a1"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.9.0' \
              -f sha='d52d689f433699a5184a01e7e68acc9c28bf18a1'
          fi

      - name: Download validated Windows and Flatpak artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming/windows-portable incoming/windows-setup incoming/flatpak release
          gh run download 32043821339 -n Mie-Survival-Windows-x64-Portable -D incoming/windows-portable
          gh run download 32043821339 -n Mie-Survival-Windows-x64-Setup -D incoming/windows-setup
          gh run download 32043821346 -n Mie-Survival-v0.9.0-Linux-x86_64-Flatpak -D incoming/flatpak

          portable="$(find incoming/windows-portable -type f -name '*.zip' | head -n 1)"
          setup="$(find incoming/windows-setup -type f -name '*.exe' | head -n 1)"
          flatpak="$(find incoming/flatpak -type f -name '*.flatpak' | head -n 1)"
          test -n "$portable" && test -f "$portable"
          test -n "$setup" && test -f "$setup"
          test -n "$flatpak" && test -f "$flatpak"

          cp "$portable" release/Mie-Survival-v0.9.0-Windows-x64-Portable.zip
          cp "$setup" release/Mie-Survival-v0.9.0-Windows-x64-Setup.exe
          cp "$flatpak" release/Mie-Survival-v0.9.0-Linux-x86_64.flatpak
          (cd release && sha256sum Mie-Survival-v0.9.0-Windows-x64-Portable.zip Mie-Survival-v0.9.0-Windows-x64-Setup.exe Mie-Survival-v0.9.0-Linux-x86_64.flatpak > SHA256SUMS.txt)

      - name: Publish GitHub Release v0.9.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.9.0 >/dev/null 2>&1; then
            gh release upload v0.9.0 release/* --clobber
          else
            gh release create v0.9.0 release/* \
              --verify-tag \
              --target d52d689f433699a5184a01e7e68acc9c28bf18a1 \
              --generate-notes \
              --title 'Mie Survival v0.9.0'
          fi
