name: Validate Survival v0.1 MSVC

on:
  push:
    branches:
      - agent/survival-v01
    paths:
      - .github/workflows/validate-survival-v01.yml

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout survival branch
        uses: actions/checkout@v4
        with:
          ref: agent/survival-v01
          fetch-depth: 1

      - name: Configure MSVC Release with legacy CMake compatibility
        run: cmake -S . -B build -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build MSVC Release
        run: cmake --build build --config Release --parallel 2

      - name: Remove one-shot workflow after successful build
        if: success()
        shell: pwsh
        run: |
          Remove-Item .github/workflows/validate-survival-v01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot Survival validation workflow"
          git push origin HEAD:agent/survival-v01
