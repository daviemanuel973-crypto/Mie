name: Apply renderer constness fix

on:
  push:
    branches:
      - fix/v0.10-entity-chunk-visibility
    paths:
      - .github/scripts/apply-entity-constness-fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.10-entity-chunk-visibility
      - name: Apply minimal renderer fix
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply-entity-constness-fix.py
          git diff --check
      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/rendering/renderer.cpp
          if git diff --cached --quiet; then
            echo "No renderer change required."
            exit 0
          fi
          git commit -m "fix(rendering): compile chunk visibility gate"
          git push origin HEAD:fix/v0.10-entity-chunk-visibility
