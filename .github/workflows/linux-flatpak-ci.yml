name: Linux Flatpak CI

on:
  push:
    branches:
      - agent/survival-linux-flatpak
      - agent/linux-lowend-performance
      - agent/release-packaging-stabilization
      - agent/release-packaging-windows-fix
      - agent/linux-world-create-crash-fix
      - agent/linux-texture-compat-fix
      - agent/linux-nonbindless-renderer-fix
      - main
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'shared/**'
      - 'resources/**'
      - 'flatpak/**'
      - '.github/workflows/linux-flatpak-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-flatpak-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak and shader tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder glslang-tools

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Verify permanent portability and renderer fixes
        run: |
          grep -F '*this = PlayerInventory{};' src/gameLayer/gameplay/items.cpp
          grep -F 'reinterpret_cast<std::uintptr_t>(packet->userData)' src/gameLayer/multyPlayer/server.cpp
          grep -F 'position += e.second.entity.getColliderOffset();' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'Player has no getColliderOffset()' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'WeaponStats weaponStats' include/gameLayer/multyPlayer/doHittingThings.h
          grep -F 'entityData.template entityGetter<X>()' src/gameLayer/multyPlayer/splitUpdatesLogic.cpp
          grep -F 'nullptr, true, channelOtherVisualThings);' src/gameLayer/multyPlayer/tick.cpp
          grep -F 'const Item &item' src/gameLayer/rendering/UiEngine.cpp
          grep -F '#include <csignal>' src/platform/platformTools.cpp
          grep -F 'USER_CONTENT_PATH="resources/"' CMakeLists.txt
          grep -F 'USER_SETTINGS_PATH="playerSettings/"' CMakeLists.txt
          grep -F 'USER_ERROR_LOG_PATH="errorLogs.txt"' CMakeLists.txt
          grep -F 'OURCRAFT_FLATPAK=1' CMakeLists.txt
          grep -F -- '-DOURCRAFT_FLATPAK=ON' flatpak/io.github.daviemanuel973.Mie.yml
          grep -F 'if (container.empty() || model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)' src/gameLayer/rendering/renderer.cpp
          grep -F 'skinningMatrix.data()' src/gameLayer/rendering/renderer.cpp
          grep -F 'glTexImage2D(GL_TEXTURE_2D' src/gameLayer/blocksLoader.cpp
          grep -F 'compatibilityTextureGridSize' src/gameLayer/blocksLoader.cpp
          grep -F 'rebuildCompatibilityTextureArray(64);' src/gameLayer/blocksLoader.cpp
          grep -F 'compatibilityTextureArray' src/gameLayer/rendering/model.cpp
          grep -F 'uniform sampler2D u_compatTextureArray;' resources/shaders/rendering/defaultShader.frag
          grep -F 'uniform int u_compatTextureGrid;' resources/shaders/rendering/defaultShader.frag
          grep -F 'uniform sampler2D u_compatTextureArray;' resources/shaders/rendering/zpass.frag
          grep -F 'sampler2DArray u_compatTextureArray' resources/shaders/basicEntity.frag
          ! grep -F 'vec4 sampleBlockNormal(vec2 uv) { return sampleBlockNormal(uv); }' resources/shaders/rendering/defaultShader.frag
          grep -F 'Recommended for this GPU:' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'Graphics: Low' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'Graphics: Medium' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'Graphics: High' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'Graphics: Ultra' src/gameLayer/rendering/renderSettings.cpp
          grep -F 'Flatpak texture-array compatibility renderer enabled' flatpak/ourcraft-launcher.sh
          ! grep -F 'MESA_LOADER_DRIVER_OVERRIDE=zink' flatpak/ourcraft-launcher.sh
          ! grep -R -F 'shaders/postProcess/' src include
          ! grep -R -F 'texture2D(' resources/shaders
          ! grep -R -F 'void swap(in out float a, in out float b)' resources/shaders
          test -f resources/shaders/postprocess/drawQuads.vert
          test -f resources/assets/otherTextures/caustics3.png

      - name: Validate Flatpak compatibility GLSL
        shell: bash
        run: |
          # The runtime prepends these four defines through
          # ShadingSettings::formatIntoGLSLcode(). Mirror a conservative Low preset
          # here so offline validation matches the real shader source seen by OpenGL.
          GLSL_DEFINES=(
            -DMIE_COMPAT_TEXTURES=1
            -Dc_shadows=0
            -Dc_PBR=0
            -Dc_SSR=0
            -Dc_useLights=1
          )
          glslangValidator "${GLSL_DEFINES[@]}" -l \
            resources/shaders/rendering/defaultShader.vert \
            resources/shaders/rendering/defaultShader.frag
          glslangValidator "${GLSL_DEFINES[@]}" -l \
            resources/shaders/rendering/zpass.vert \
            resources/shaders/rendering/zpass.frag
          glslangValidator "${GLSL_DEFINES[@]}" -l \
            resources/shaders/basicEntity.vert \
            resources/shaders/basicEntity.frag

      - name: Build Flatpak repository
        shell: bash
        run: |
          set -o pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak flatpak/io.github.daviemanuel973.Mie.yml \
            2>&1 | tee flatpak-build.log

      - name: Upload Flatpak failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-failure-log
          path: flatpak-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Create installable bundle
        run: |
          flatpak build-bundle flatpak-repo Mie-Survival-Linux-x86_64.flatpak \
            io.github.daviemanuel973.Mie stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke-test install and writable user data
        run: |
          flatpak remote-add --user --if-not-exists --no-gpg-verify mie-ci "$(pwd)/flatpak-repo"
          flatpak install --user -y mie-ci io.github.daviemanuel973.Mie
          flatpak info --user io.github.daviemanuel973.Mie
          flatpak run io.github.daviemanuel973.Mie --prepare-data-only
          data_root="$HOME/.var/app/io.github.daviemanuel973.Mie/data/ourcraft"
          test -d "$data_root/resources/worlds"
          test -d "$data_root/resources/texturePacks"
          test -d "$data_root/resources/skins"
          test -d "$data_root/playerSettings"
          test -w "$data_root/resources/worlds"
          test -w "$data_root/playerSettings"

      - name: Upload Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Linux-x86_64-nonbindless-renderer-fix
          path: Mie-Survival-Linux-x86_64.flatpak
          if-no-files-found: error
