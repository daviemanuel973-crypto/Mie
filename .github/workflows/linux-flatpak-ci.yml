name: Linux Flatpak CI

on:
  push:
    branches:
      - agent/survival-linux-flatpak
      - agent/linux-lowend-performance
      - agent/release-packaging-stabilization
      - agent/release-packaging-windows-fix
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'shared/**'
      - 'resources/**'
      - 'flatpak/**'
      - '.github/workflows/linux-flatpak-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-flatpak-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Verify permanent GCC portability fixes
        run: |
          grep -F '*this = PlayerInventory{};' src/gameLayer/gameplay/items.cpp
          grep -F 'reinterpret_cast<std::uintptr_t>(packet->userData)' src/gameLayer/multyPlayer/server.cpp
          grep -F 'position += e.second.entity.getColliderOffset();' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'Player has no getColliderOffset()' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'WeaponStats weaponStats' include/gameLayer/multyPlayer/doHittingThings.h
          grep -F 'entityData.template entityGetter<X>()' src/gameLayer/multyPlayer/splitUpdatesLogic.cpp
          grep -F 'nullptr, true, channelOtherVisualThings);' src/gameLayer/multyPlayer/tick.cpp
          grep -F 'const Item &item' src/gameLayer/rendering/UiEngine.cpp
          grep -F '#include <csignal>' src/platform/platformTools.cpp
          grep -F 'USER_CONTENT_PATH="resources/"' CMakeLists.txt
          grep -F 'USER_SETTINGS_PATH="playerSettings/"' CMakeLists.txt
          grep -F 'USER_ERROR_LOG_PATH="errorLogs.txt"' CMakeLists.txt

      - name: Build Flatpak repository
        shell: bash
        run: |
          set -o pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak flatpak/io.github.daviemanuel973.Mie.yml \
            2>&1 | tee flatpak-build.log

      - name: Upload Flatpak failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-failure-log
          path: flatpak-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Create installable bundle
        run: |
          flatpak build-bundle flatpak-repo Mie-Survival-Linux-x86_64.flatpak \
            io.github.daviemanuel973.Mie stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke-test install and writable user data
        run: |
          flatpak remote-add --user --if-not-exists --no-gpg-verify mie-ci "$(pwd)/flatpak-repo"
          flatpak install --user -y mie-ci io.github.daviemanuel973.Mie
          flatpak info --user io.github.daviemanuel973.Mie
          flatpak run io.github.daviemanuel973.Mie --prepare-data-only
          data_root="$HOME/.var/app/io.github.daviemanuel973.Mie/data/ourcraft"
          test -d "$data_root/resources/worlds"
          test -d "$data_root/resources/texturePacks"
          test -d "$data_root/resources/skins"
          test -d "$data_root/playerSettings"
          test -w "$data_root/resources/worlds"
          test -w "$data_root/playerSettings"

      - name: Upload Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Linux-x86_64
          path: Mie-Survival-Linux-x86_64.flatpak
          if-no-files-found: error
