name: Import ourCraft source snapshot

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Fetch exact very_pre_alpha2 source snapshot
        run: |
          git clone --depth 1 --branch very_pre_alpha2 https://github.com/meemknight/ourCraft.git /tmp/ourcraft-upstream
          rm -rf /tmp/ourcraft-upstream/.git

      - name: Import complete source tree without deleting this workflow
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/import-source.yml' \
            /tmp/ourcraft-upstream/ ./

      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source snapshot already imported.'
            exit 0
          fi
          git commit -m 'Import ourCraft very_pre_alpha2 source snapshot'
          git push origin HEAD:main
