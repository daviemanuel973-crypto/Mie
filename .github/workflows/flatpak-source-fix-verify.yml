name: Flatpak Source Fix Verification

on:
  push:
    branches:
      - agent/release-packaging-flatpak-fix
    paths:
      - '.github/workflows/flatpak-source-fix-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-flatpak-fix
          fetch-depth: 0

      - name: Apply permanent renderer GCC fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cpp = Path('src/gameLayer/rendering/renderer.cpp')
          text = cpp.read_text(encoding='utf-8')

          # Visual Studio folding pragmas have no runtime meaning. GCC rejects
          # some of them inside aggregate initializers, so preserve them as comments.
          text, region_count = re.subn(r'^(\s*)#pragma region(.*)$', r'\1// region\2', text, flags=re.MULTILINE)
          text, end_count = re.subn(r'^(\s*)#pragma endregion\s*$', r'\1// endregion', text, flags=re.MULTILINE)
          if '#pragma region' in text or '#pragma endregion' in text:
              raise SystemExit('renderer.cpp still contains region pragmas')

          old_cpp = 'glm::mat4 &vp, glm::mat4 &projection,'
          new_cpp = 'glm::mat4 &vp, const glm::mat4 &projection,'
          if old_cpp in text:
              if text.count(old_cpp) != 1:
                  raise SystemExit(f'Unexpected renderer.cpp projection signature count: {text.count(old_cpp)}')
              text = text.replace(old_cpp, new_cpp, 1)
          elif new_cpp not in text:
              raise SystemExit('renderer.cpp projection signature not found')
          cpp.write_text(text, encoding='utf-8')
          print(f'Converted renderer folding pragmas: {region_count} regions, {end_count} endings')

          header = Path('include/gameLayer/rendering/renderer.h')
          text = header.read_text(encoding='utf-8')
          old_h = 'glm::mat4 &vp, glm::mat4 &projection, glm::mat4 &viewMatrix'
          new_h = 'glm::mat4 &vp, const glm::mat4 &projection, glm::mat4 &viewMatrix'
          if old_h in text:
              if text.count(old_h) != 1:
                  raise SystemExit(f'Unexpected renderer.h projection signature count: {text.count(old_h)}')
              text = text.replace(old_h, new_h, 1)
          elif new_h not in text:
              raise SystemExit('renderer.h projection signature not found')
          header.write_text(text, encoding='utf-8')
          PY

          grep -F 'const glm::mat4 &projection' src/gameLayer/rendering/renderer.cpp
          grep -F 'const glm::mat4 &projection' include/gameLayer/rendering/renderer.h
          if grep -Eq '#pragma (region|endregion)' src/gameLayer/rendering/renderer.cpp; then
            echo 'renderer.cpp still contains Visual Studio region pragmas' >&2
            exit 1
          fi

      - name: Commit renderer corrections on isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gameLayer/rendering/renderer.cpp include/gameLayer/rendering/renderer.h
          if git diff --cached --quiet; then
            echo 'Renderer fixes already committed.'
          else
            git commit -m 'fix: make renderer source GCC-compatible'
            git push origin HEAD:agent/release-packaging-flatpak-fix
          fi

      - name: Verify earlier permanent GCC fixes
        run: |
          grep -F 'Player has no getColliderOffset()' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'nullptr, true, channelOtherVisualThings);' src/gameLayer/multyPlayer/tick.cpp
          grep -F '*this = PlayerInventory{};' src/gameLayer/gameplay/items.cpp
          grep -F 'reinterpret_cast<std::uintptr_t>(packet->userData)' src/gameLayer/multyPlayer/server.cpp
          grep -F 'WeaponStats weaponStats' include/gameLayer/multyPlayer/doHittingThings.h
          grep -F 'entityData.template entityGetter<X>()' src/gameLayer/multyPlayer/splitUpdatesLogic.cpp
          grep -F 'const Item &item' src/gameLayer/rendering/UiEngine.cpp

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build Flatpak repository
        shell: bash
        run: |
          set -o pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak flatpak/io.github.daviemanuel973.Mie.yml \
            2>&1 | tee flatpak-build.log

      - name: Upload Flatpak failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-source-fix-failure-log
          path: flatpak-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Create installable bundle
        run: |
          flatpak build-bundle flatpak-repo Mie-Survival-Linux-x86_64.flatpak \
            io.github.daviemanuel973.Mie stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke-test installation metadata
        run: |
          flatpak remote-add --user --if-not-exists --no-gpg-verify mie-ci "$(pwd)/flatpak-repo"
          flatpak install --user -y mie-ci io.github.daviemanuel973.Mie
          flatpak info --user io.github.daviemanuel973.Mie

      - name: Upload verified Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Linux-x86_64-source-fix
          path: Mie-Survival-Linux-x86_64.flatpak
          if-no-files-found: error
