name: Flatpak Source Fix Verification

on:
  push:
    branches:
      - agent/release-packaging-flatpak-fix
    paths:
      - '.github/workflows/flatpak-source-fix-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-flatpak-fix
          fetch-depth: 0

      - name: Apply permanent GCC source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once_or_verify(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f'{path_name}: expected at most one occurrence of {old!r}, found {count}')
              if count == 1:
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'{path_name}: neither old nor corrected form was found for {old!r}')

          # Server collision fixes discovered by the first Flatpak GCC build.
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/serverChunkStorer.cpp',
              'position += e.second.entityBuffered.getColliderOffset();',
              'position += e.second.entity.getColliderOffset();')
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/serverChunkStorer.cpp',
              'if constexpr (hasGetColliderOffset<decltype(e.second->entity)>) { positionPlayer += e.second->entityBuffered.getColliderOffset(); }',
              '// Player has no getColliderOffset(); keep the position returned by getPosition() unchanged.')

          # broadCastNotLocked takes ENetPeer* as argument four; no peer is excluded here.
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/tick.cpp',
              'false, true, channelOtherVisualThings);',
              'nullptr, true, channelOtherVisualThings);')
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/tick.cpp',
              'false, true, channelChunksAndBlocks);',
              'nullptr, true, channelChunksAndBlocks);')

          # Portability fixes that were previously only injected temporarily by CI.
          replace_once_or_verify(
              'src/gameLayer/gameplay/items.cpp',
              '*this = {};',
              '*this = PlayerInventory{};')
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/server.cpp',
              'unsigned int userData = (unsigned int)packet->userData;',
              'unsigned int userData = static_cast<unsigned int>(reinterpret_cast<std::uintptr_t>(packet->userData));')
          replace_once_or_verify(
              'include/gameLayer/multyPlayer/doHittingThings.h',
              'WeaponStats &weaponStats',
              'WeaponStats weaponStats')
          replace_once_or_verify(
              'src/gameLayer/multyPlayer/splitUpdatesLogic.cpp',
              'return entityData.entityGetter<X>();',
              'return entityData.template entityGetter<X>();')

          # renderOneItem never mutates Item; const-ref accepts both inventory items and temporaries.
          replace_once_or_verify(
              'src/gameLayer/rendering/UiEngine.cpp',
              'auto renderOneItem = [&](glm::vec4 itemBox, Item &item, float in = 0, float color = 1, gl2d::Texture icon = {})',
              'auto renderOneItem = [&](glm::vec4 itemBox, const Item &item, float in = 0, float color = 1, gl2d::Texture icon = {})')
          PY

          grep -F 'position += e.second.entity.getColliderOffset();' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'Player has no getColliderOffset()' src/gameLayer/multyPlayer/serverChunkStorer.cpp
          grep -F 'nullptr, true, channelOtherVisualThings);' src/gameLayer/multyPlayer/tick.cpp
          grep -F 'nullptr, true, channelChunksAndBlocks);' src/gameLayer/multyPlayer/tick.cpp
          grep -F '*this = PlayerInventory{};' src/gameLayer/gameplay/items.cpp
          grep -F 'reinterpret_cast<std::uintptr_t>(packet->userData)' src/gameLayer/multyPlayer/server.cpp
          grep -F 'WeaponStats weaponStats' include/gameLayer/multyPlayer/doHittingThings.h
          grep -F 'entityData.template entityGetter<X>()' src/gameLayer/multyPlayer/splitUpdatesLogic.cpp
          grep -F 'const Item &item' src/gameLayer/rendering/UiEngine.cpp

      - name: Commit corrected source on isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/gameLayer/multyPlayer/serverChunkStorer.cpp \
            src/gameLayer/multyPlayer/tick.cpp \
            src/gameLayer/gameplay/items.cpp \
            src/gameLayer/multyPlayer/server.cpp \
            include/gameLayer/multyPlayer/doHittingThings.h \
            src/gameLayer/multyPlayer/splitUpdatesLogic.cpp \
            src/gameLayer/rendering/UiEngine.cpp
          if git diff --cached --quiet; then
            echo 'Permanent source fixes already committed.'
          else
            git commit -m 'fix: persist Linux GCC portability corrections'
            git push origin HEAD:agent/release-packaging-flatpak-fix
          fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Verify permanent portability fixes
        run: |
          grep -F '*this = PlayerInventory{};' src/gameLayer/gameplay/items.cpp
          grep -F 'reinterpret_cast<std::uintptr_t>(packet->userData)' src/gameLayer/multyPlayer/server.cpp
          grep -F 'WeaponStats weaponStats' include/gameLayer/multyPlayer/doHittingThings.h
          grep -F 'entityData.template entityGetter<X>()' src/gameLayer/multyPlayer/splitUpdatesLogic.cpp
          grep -F 'const Item &item' src/gameLayer/rendering/UiEngine.cpp

      - name: Build Flatpak repository
        shell: bash
        run: |
          set -o pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo build-flatpak flatpak/io.github.daviemanuel973.Mie.yml \
            2>&1 | tee flatpak-build.log

      - name: Upload Flatpak failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-source-fix-failure-log
          path: flatpak-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Create installable bundle
        run: |
          flatpak build-bundle flatpak-repo Mie-Survival-Linux-x86_64.flatpak \
            io.github.daviemanuel973.Mie stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke-test installation metadata
        run: |
          flatpak remote-add --user --if-not-exists --no-gpg-verify mie-ci "$(pwd)/flatpak-repo"
          flatpak install --user -y mie-ci io.github.daviemanuel973.Mie
          flatpak info --user io.github.daviemanuel973.Mie

      - name: Upload verified Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Mie-Survival-Linux-x86_64-source-fix
          path: Mie-Survival-Linux-x86_64.flatpak
          if-no-files-found: error
