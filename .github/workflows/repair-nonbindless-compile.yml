name: Repair Non-Bindless Compile

on:
  push:
    branches:
      - agent/linux-nonbindless-renderer-fix
    paths:
      - '.github/workflows/repair-nonbindless-compile.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/linux-nonbindless-renderer-fix
      - name: Repair and harden Linux compatibility renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the compatibility atlas grid declaration normalized and idempotent.
          p = Path('include/gameLayer/blocksLoader.h')
          s = p.read_text()
          pattern = r'^\s*(?:static\s+inline\s+)*int compatibilityTextureGridSize = 1;$'
          replacement = '\tstatic inline int compatibilityTextureGridSize = 1;'
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('Could not normalize compatibilityTextureGridSize declaration')
          p.write_text(s2)

          # reloadShaders() has no BlocksLoader instance; use the shared grid value.
          p = Path('src/gameLayer/rendering/renderer.cpp')
          s = p.read_text()
          old = 'glUniform1i(zpassShader.u_compatTextureGrid, blocksLoader.compatibilityTextureGridSize);'
          new = 'glUniform1i(zpassShader.u_compatTextureGrid, BlocksLoader::compatibilityTextureGridSize);'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not locate z-pass compatibility grid uniform')
          p.write_text(s)

          # Preserve the previous non-bindless header repair if an older checkout still needs it.
          p = Path('include/gameLayer/rendering/model.h')
          s = p.read_text()
          s = s.replace('int compatibilityTextureArraySize = PLAYER_SKIN_SIZE;', 'int compatibilityTextureArraySize = 128;')
          s = s.replace('void rebuildCompatibilityTextureArray(int targetSize = PLAYER_SKIN_SIZE);', 'void rebuildCompatibilityTextureArray(int targetSize = 128);')
          p.write_text(s)

          # The Flatpak compatibility shaders do not consume ARB bindless handles.
          # Avoid calling ARB_bindless_texture at runtime on Mesa/Intel GPUs that do not expose it.
          def harden_texture_handles(path, insertion_marker):
              p = Path(path)
              s = p.read_text()
              helper_name = 'getTextureRuntimeHandle'
              if helper_name not in s:
                  pair = re.compile(
                      r'(?m)^([ \t]*)([^=\n]+?)\s*=\s*glGetTextureHandleARB\(([^;\n]+)\);\s*\n[ \t]*glMakeTextureHandleResidentARB\([^;\n]+\);'
                  )
                  s, replaced = pair.subn(r'\1\2 = getTextureRuntimeHandle(\3);', s)
                  if replaced == 0:
                      raise SystemExit(f'No bindless handle pairs replaced in {path}')
                  if 'glGetTextureHandleARB(' in s:
                      raise SystemExit(f'Unpaired bindless handle call remains in {path}')

                  helper = '''\nstatic GLuint64 getTextureRuntimeHandle(GLuint textureId)\n{\n#if defined(OURCRAFT_FLATPAK)\n\t// Compatibility shaders use atlas/array indices, not bindless handles.\n\t// Preserve a stable non-zero CPU-side identity without touching ARB_bindless_texture.\n\treturn static_cast<GLuint64>(textureId);\n#else\n\tauto handle = glGetTextureHandleARB(textureId);\n\tglMakeTextureHandleResidentARB(handle);\n\treturn handle;\n#endif\n}\n\n'''
                  if insertion_marker not in s:
                      raise SystemExit(f'Insertion marker missing in {path}')
                  s = s.replace(insertion_marker, helper + insertion_marker, 1)
              p.write_text(s)

          harden_texture_handles('src/gameLayer/blocksLoader.cpp', '//loadallblocks')
          harden_texture_handles('src/gameLayer/rendering/model.cpp', 'glm::mat4 aiToGlm')
          PY
          grep -F 'static inline int compatibilityTextureGridSize = 1;' include/gameLayer/blocksLoader.h
          ! grep -F 'static inline static inline' include/gameLayer/blocksLoader.h
          grep -F 'glUniform1i(zpassShader.u_compatTextureGrid, BlocksLoader::compatibilityTextureGridSize);' src/gameLayer/rendering/renderer.cpp
          grep -F 'return static_cast<GLuint64>(textureId);' src/gameLayer/blocksLoader.cpp
          grep -F 'return static_cast<GLuint64>(textureId);' src/gameLayer/rendering/model.cpp
          test "$(grep -c 'glGetTextureHandleARB(' src/gameLayer/blocksLoader.cpp)" -eq 1
          test "$(grep -c 'glGetTextureHandleARB(' src/gameLayer/rendering/model.cpp)" -eq 1
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Virgil_Hawkings"
          git config user.email "daviemanuel973@gmail.com"
          git add include/gameLayer/blocksLoader.h src/gameLayer/rendering/renderer.cpp include/gameLayer/rendering/model.h src/gameLayer/blocksLoader.cpp src/gameLayer/rendering/model.cpp
          if git diff --cached --quiet; then
            echo "Renderer repair already applied."
            exit 0
          fi
          git commit -m "fix: avoid bindless texture calls in Linux compatibility mode"
          git push origin HEAD:agent/linux-nonbindless-renderer-fix

# Revalidation marker: source hardening is already present in this commit.
