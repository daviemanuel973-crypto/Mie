name: Apply Low-End Performance Patch

on:
  push:
    branches:
      - agent/linux-lowend-performance
    paths:
      - tools/apply_lowend_optimization.py
      - .github/workflows/apply-lowend-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-performance-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/linux-lowend-performance
          fetch-depth: 0

      - name: Apply deterministic source transformations
        run: python3 tools/apply_lowend_optimization.py

      - name: Keep workflow files out of the bot-authored commit
        run: git checkout -- .github/workflows/linux-flatpak-ci.yml

      - name: Validate resulting diff
        run: git diff --check

      - name: Commit optimized sources
        run: |
          rm -f patches/lowend-performance.patch
          rm -f tools/apply_lowend_optimization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Linux build for low-end hardware"
          git push origin HEAD:agent/linux-lowend-performance
