name: Harden Linux Texture Atlas

on:
  push:
    branches:
      - agent/linux-nonbindless-renderer-fix
    paths:
      - '.github/workflows/harden-linux-texture-atlas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/linux-nonbindless-renderer-fix

      - name: Replace oversized texture array with bounded atlas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # BlocksLoader metadata.
          p = Path('include/gameLayer/blocksLoader.h')
          s = p.read_text()
          if 'compatibilityTextureGridSize' not in s:
              s = s.replace('int compatibilityTextureArraySize = 128;\n\tvoid rebuildCompatibilityTextureArray(int targetSize = 128);',
                  'int compatibilityTextureArraySize = 64;\n\tint compatibilityTextureGridSize = 1;\n\tvoid rebuildCompatibilityTextureArray(int targetSize = 64);')
          p.write_text(s)

          # Replace the potentially > GL_MAX_ARRAY_TEXTURE_LAYERS allocation with one 2D atlas.
          p = Path('src/gameLayer/blocksLoader.cpp')
          s = p.read_text()
          pattern = re.compile(r'void BlocksLoader::rebuildCompatibilityTextureArray\(int targetSize\)\n\{.*?\n\}\n\n//textureloader texture loader', re.S)
          replacement = r'''void BlocksLoader::rebuildCompatibilityTextureArray(int targetSize)
          {
              if (compatibilityTextureArray)
              {
                  glDeleteTextures(1, &compatibilityTextureArray);
                  compatibilityTextureArray = 0;
              }
              if (texturesIds.empty()) return;

              GLint maxTextureSize = 4096;
              glGetIntegerv(GL_MAX_TEXTURE_SIZE, &maxTextureSize);

              compatibilityTextureGridSize = static_cast<int>(std::ceil(std::sqrt(static_cast<double>(texturesIds.size()))));
              compatibilityTextureGridSize = std::max(1, compatibilityTextureGridSize);

              int maxTileSize = std::max(8, maxTextureSize / compatibilityTextureGridSize);
              compatibilityTextureArraySize = std::max(8, std::min(targetSize, maxTileSize));
              const int atlasSize = compatibilityTextureGridSize * compatibilityTextureArraySize;

              glGenTextures(1, &compatibilityTextureArray);
              glActiveTexture(GL_TEXTURE0 + 15);
              glBindTexture(GL_TEXTURE_2D, compatibilityTextureArray);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, atlasSize, atlasSize, 0,
                  GL_RGBA, GL_UNSIGNED_BYTE, nullptr);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);

              for (size_t layer = 0; layer < texturesIds.size(); layer++)
              {
                  auto data = resizeBlockTextureNearestCompat(texturesIds[layer], compatibilityTextureArraySize);
                  int tileX = static_cast<int>(layer % compatibilityTextureGridSize);
                  int tileY = static_cast<int>(layer / compatibilityTextureGridSize);
                  glTexSubImage2D(GL_TEXTURE_2D, 0,
                      tileX * compatibilityTextureArraySize,
                      tileY * compatibilityTextureArraySize,
                      compatibilityTextureArraySize, compatibilityTextureArraySize,
                      GL_RGBA, GL_UNSIGNED_BYTE, data.data());
              }

              // No mipmaps in compatibility mode: avoids cross-tile bleeding and saves VRAM.
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glActiveTexture(GL_TEXTURE0);

              std::cout << "Compatibility texture atlas: " << texturesIds.size()
                  << " layers, grid " << compatibilityTextureGridSize << "x"
                  << compatibilityTextureGridSize << ", tile " << compatibilityTextureArraySize
                  << "px, atlas " << atlasSize << "px" << std::endl;
          }

          //textureloader texture loader'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('could not replace compatibility texture allocation')
          s = s.replace('rebuildCompatibilityTextureArray(128);', 'rebuildCompatibilityTextureArray(64);')
          p.write_text(s)

          # Main block shader: use one sampler2D atlas and preserve four PBR map offsets.
          p = Path('resources/shaders/rendering/defaultShader.frag')
          s = p.read_text()
          pattern = re.compile(r'#ifdef MIE_COMPAT_TEXTURES\nin flat int v_compatTextureIndex;.*?#else\nvec4 sampleBlockAlbedo\(vec2 uv\).*?#endif', re.S)
          replacement = r'''#ifdef MIE_COMPAT_TEXTURES
          in flat int v_compatTextureIndex;
          uniform sampler2D u_compatTextureArray;
          uniform int u_compatTextureGrid;
          vec2 compatibilityAtlasUV(vec2 uv, int textureIndex)
          {
              float grid = float(max(u_compatTextureGrid, 1));
              int safeIndex = max(textureIndex, 0);
              vec2 tile = vec2(float(safeIndex % u_compatTextureGrid), float(safeIndex / u_compatTextureGrid));
              vec2 localUV = clamp(fract(uv), vec2(0.001), vec2(0.999));
              return (tile + localUV) / grid;
          }
          vec4 sampleBlockAlbedo(vec2 uv) { return texture(u_compatTextureArray, compatibilityAtlasUV(uv, v_compatTextureIndex)); }
          vec4 sampleBlockNormal(vec2 uv) { return texture(u_compatTextureArray, compatibilityAtlasUV(uv, v_compatTextureIndex + 1)); }
          vec4 sampleBlockMaterial(vec2 uv) { return texture(u_compatTextureArray, compatibilityAtlasUV(uv, v_compatTextureIndex + 2)); }
          vec4 sampleBlockParallax(vec2 uv) { return texture(u_compatTextureArray, compatibilityAtlasUV(uv, v_compatTextureIndex + 3)); }
          #else
          vec4 sampleBlockAlbedo(vec2 uv) { return texture(sampler2D(v_textureSampler), uv); }
          vec4 sampleBlockNormal(vec2 uv) { return texture(sampler2D(v_normalSampler), uv); }
          vec4 sampleBlockMaterial(vec2 uv) { return texture(sampler2D(v_materialSampler), uv); }
          vec4 sampleBlockParallax(vec2 uv) { return texture(sampler2D(v_paralaxSampler), uv); }
          #endif'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('could not replace default shader compat sampling')
          p.write_text(s)

          # Z pre-pass uses the same atlas and grid.
          p = Path('resources/shaders/rendering/zpass.frag')
          s = p.read_text()
          s = s.replace('uniform sampler2DArray u_compatTextureArray;', 'uniform sampler2D u_compatTextureArray;\nuniform int u_compatTextureGrid;')
          old = 'float a = texture(u_compatTextureArray, vec3(v_uv, float(v_compatTextureIndex))).a;'
          new = '''float grid = float(max(u_compatTextureGrid, 1));
              int safeIndex = max(v_compatTextureIndex, 0);
              vec2 tile = vec2(float(safeIndex % u_compatTextureGrid), float(safeIndex / u_compatTextureGrid));
              vec2 localUV = clamp(fract(v_uv), vec2(0.001), vec2(0.999));
              float a = texture(u_compatTextureArray, (tile + localUV) / grid).a;'''
          if old not in s:
              raise SystemExit('zpass compat sample not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Renderer structs expose grid uniform.
          p = Path('include/gameLayer/rendering/renderer.h')
          s = p.read_text()
          s = s.replace('uniform u_compatTextureArray = -1;\n\t\tuniform u_time = -1;',
              'uniform u_compatTextureArray = -1;\n\t\tuniform u_compatTextureGrid = -1;\n\t\tuniform u_time = -1;', 1)
          s = s.replace('uniform u_compatTextureArray = -1;\n\t\tGLuint u_renderOnlyWater;',
              'uniform u_compatTextureArray = -1;\n\t\tuniform u_compatTextureGrid = -1;\n\t\tGLuint u_renderOnlyWater;', 1)
          p.write_text(s)

          # Renderer binds atlas as 2D and supplies grid to default + zpass.
          p = Path('src/gameLayer/rendering/renderer.cpp')
          s = p.read_text()
          s = s.replace('glBindTexture(GL_TEXTURE_2D_ARRAY, blocksLoader.compatibilityTextureArray);',
              'glBindTexture(GL_TEXTURE_2D, blocksLoader.compatibilityTextureArray);', 1)
          if 'GET_UNIFORM2(defaultShader, u_compatTextureGrid);' not in s:
              s = s.replace('GET_UNIFORM2(defaultShader, u_compatTextureArray);',
                  'GET_UNIFORM2(defaultShader, u_compatTextureArray);\n\tGET_UNIFORM2(defaultShader, u_compatTextureGrid);', 1)
          if 'GET_UNIFORM2(zpassShader, u_compatTextureGrid);' not in s:
              s = s.replace('GET_UNIFORM2(zpassShader, u_compatTextureArray);',
                  'GET_UNIFORM2(zpassShader, u_compatTextureArray);\n\t\tGET_UNIFORM2(zpassShader, u_compatTextureGrid);', 1)
          s = s.replace('glUniform1i(zpassShader.u_compatTextureArray, 15);',
              'glUniform1i(zpassShader.u_compatTextureArray, 15);\n\t\tglUniform1i(zpassShader.u_compatTextureGrid, blocksLoader.compatibilityTextureGridSize);')
          s = s.replace('glUniform1i(defaultShader.u_compatTextureArray, 15);',
              'glUniform1i(defaultShader.u_compatTextureArray, 15);\n\t\tglUniform1i(defaultShader.u_compatTextureGrid, blocksLoader.compatibilityTextureGridSize);')
          # Keep model texture array inside the guaranteed 0..15 fragment sampler range.
          s = s.replace('glActiveTexture(GL_TEXTURE0 + 16);\n\tglBindTexture(GL_TEXTURE_2D_ARRAY, modelsManager.compatibilityTextureArray);\n\tglUniform1i(entityRenderer.basicEntityShader.u_compatTextureArray, 16);',
              'glActiveTexture(GL_TEXTURE0 + 15);\n\tglBindTexture(GL_TEXTURE_2D_ARRAY, modelsManager.compatibilityTextureArray);\n\tglUniform1i(entityRenderer.basicEntityShader.u_compatTextureArray, 15);')
          p.write_text(s)

          # Ensure there is no accidental recursive shader helper left.
          frag = Path('resources/shaders/rendering/defaultShader.frag').read_text()
          if 'vec4 sampleBlockNormal(vec2 uv) { return sampleBlockNormal(uv); }' in frag:
              raise SystemExit('recursive normal sampler still present')

          checks = [
              ('src/gameLayer/blocksLoader.cpp', 'glTexImage2D(GL_TEXTURE_2D'),
              ('src/gameLayer/blocksLoader.cpp', 'rebuildCompatibilityTextureArray(64);'),
              ('resources/shaders/rendering/defaultShader.frag', 'uniform int u_compatTextureGrid;'),
              ('resources/shaders/rendering/zpass.frag', 'uniform sampler2D u_compatTextureArray;'),
              ('src/gameLayer/rendering/renderer.cpp', 'u_compatTextureGrid, blocksLoader.compatibilityTextureGridSize'),
          ]
          for path, needle in checks:
              if needle not in Path(path).read_text():
                  raise SystemExit(f'{path}: missing {needle}')
          PY
          git diff --check

      - name: Commit atlas hardening
        shell: bash
        run: |
          git config user.name "Virgil_Hawkings"
          git config user.email "daviemanuel973@gmail.com"
          git add include src resources
          git commit -m "fix: bound Linux block textures in low-VRAM atlas"
          git push origin HEAD:agent/linux-nonbindless-renderer-fix
