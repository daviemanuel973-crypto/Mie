name: Apply v0.9.6 Client reference fix

on:
  push:
    branches:
      - codex/v0.9.6-stability-skins
    paths:
      - tools/apply_v096_client_ref_fix.py

permissions:
  contents: write

jobs:
  apply-client-ref-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.9.6-stability-skins
          fetch-depth: 0

      - name: Apply guarded compile fix
        run: python3 tools/apply_v096_client_ref_fix.py

      - name: Verify targeted change
        run: |
          git diff --check
          grep -F 'resyncAndCloseInteraction(c.second);' src/gameLayer/multyPlayer/tick.cpp
          ! grep -F 'resyncAndCloseInteraction(*c.second);' src/gameLayer/multyPlayer/tick.cpp

      - name: Commit compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/tick.cpp
          git commit -m "fix(v0.9.6): pass station client by reference"
          git push origin HEAD:codex/v0.9.6-stability-skins
