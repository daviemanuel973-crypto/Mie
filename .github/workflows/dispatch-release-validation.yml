name: Dispatch release validation

on:
  push:
    branches:
      - agent/release-packaging-stabilization
    paths:
      - .github/workflows/dispatch-release-validation.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-stabilization
          fetch-depth: 0
      - name: Remove helper and dispatch final-head validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/dispatch-release-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-release-validation.yml
          git commit -m "CI: remove temporary validation dispatcher"
          git push origin HEAD:agent/release-packaging-stabilization
          gh workflow run linux-flatpak-ci.yml --repo "${GITHUB_REPOSITORY}" --ref agent/release-packaging-stabilization
          gh workflow run windows-msvc-ci.yml --repo "${GITHUB_REPOSITORY}" --ref agent/release-packaging-stabilization
