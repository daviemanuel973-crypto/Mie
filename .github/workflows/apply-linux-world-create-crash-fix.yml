name: Apply Linux World Create Crash Fix

on:
  push:
    branches:
      - agent/linux-world-create-crash-fix
    paths:
      - '.github/workflows/apply-linux-world-create-crash-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated crash-fix branch
        uses: actions/checkout@v6
        with:
          ref: agent/linux-world-create-crash-fix
          fetch-depth: 0

      - name: Apply runtime crash and Mesa shader fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('src/gameLayer/rendering/renderer.cpp')
          text = renderer.read_text(encoding='utf-8')

          # Linux filesystems are case-sensitive; the repository directory is postprocess.
          text = text.replace('shaders/postProcess/', 'shaders/postprocess/')

          # Do not index an unloaded hand model.
          hand_anchor = 'auto &model = modelsManager.rightHand;\n\n\t\tglBindVertexArray(model.vao);'
          hand_fixed = (
              'auto &model = modelsManager.rightHand;\n\n'
              '\t\tif (model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)\n'
              '\t\t{\n'
              '\t\t\treturn;\n'
              '\t\t}\n\n'
              '\t\tglBindVertexArray(model.vao);'
          )
          if hand_anchor in text:
              text = text.replace(hand_anchor, hand_fixed, 1)
          elif 'if (model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)' not in text:
              raise SystemExit('renderer.cpp: hand guard anchor not found')

          # Empty entity containers are normal in a newly created world. Avoid vector[0]
          # and avoid invoking animation code without model transforms.
          entity_anchor = 'auto renderAllEntitiesOfOneType = [&](Model &model, auto &container, bool isPlayers = 0)\n\t{\n\n\t\tglBindVertexArray(model.vao);'
          entity_fixed = (
              'auto renderAllEntitiesOfOneType = [&](Model &model, auto &container, bool isPlayers = 0)\n'
              '\t{\n\n'
              '\t\tif (container.empty() || model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)\n'
              '\t\t{\n'
              '\t\t\treturn;\n'
              '\t\t}\n\n'
              '\t\tglBindVertexArray(model.vao);'
          )
          if entity_anchor in text:
              text = text.replace(entity_anchor, entity_fixed, 1)
          elif 'if (container.empty() || model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)' not in text:
              raise SystemExit('renderer.cpp: entity guard anchor not found')

          # Passing data() is valid for glBufferData and avoids libstdc++ operator[]
          # assertions if a vector is empty.
          text = text.replace('&skinningMatrix[0][0][0]', 'skinningMatrix.data()')

          draw_anchor = ('\t\tglDrawElementsInstanced(GL_TRIANGLES, model.vertexCount, GL_UNSIGNED_INT, nullptr,\n'
                         '\t\t\tcontainer.size());')
          draw_fixed = ('\t\tif (skinningMatrix.empty() || entityData.empty())\n'
                        '\t\t{\n'
                        '\t\t\treturn;\n'
                        '\t\t}\n\n'
                        '\t\tglDrawElementsInstanced(GL_TRIANGLES, model.vertexCount, GL_UNSIGNED_INT, nullptr,\n'
                        '\t\t\tstatic_cast<GLsizei>(entityData.size()));')
          if draw_anchor in text:
              text = text.replace(draw_anchor, draw_fixed, 1)
          elif 'static_cast<GLsizei>(entityData.size())' not in text:
              raise SystemExit('renderer.cpp: instanced draw anchor not found')

          renderer.write_text(text, encoding='utf-8')

          game = Path('src/gameLayer/gameLayer.cpp')
          text = game.read_text(encoding='utf-8')
          if 'caustics.png' in text:
              text = text.replace('caustics.png', 'caustics3.png')
          elif 'caustics3.png' not in text:
              raise SystemExit('gameLayer.cpp: caustics texture reference not found')
          game.write_text(text, encoding='utf-8')

          # GLSL 4.30 core on Mesa rejects legacy texture2D and the malformed
          # "in out" qualifier accepted by some drivers.
          changed_shader_count = 0
          for shader in Path('resources/shaders').rglob('*'):
              if not shader.is_file() or shader.suffix not in {'.frag', '.vert', '.glsl'}:
                  continue
              source = shader.read_text(encoding='utf-8')
              fixed = source.replace('texture2D(', 'texture(')
              fixed = fixed.replace('void swap(in out float a, in out float b)',
                                    'void swap(inout float a, inout float b)')
              if fixed != source:
                  shader.write_text(fixed, encoding='utf-8')
                  changed_shader_count += 1

          print(f'Updated {changed_shader_count} shader file(s) for Mesa core GLSL.')
          PY

      - name: Verify runtime-fix invariants
        shell: bash
        run: |
          grep -F 'if (container.empty() || model.transforms.empty() || model.vertexCount == 0 || model.vao == 0)' src/gameLayer/rendering/renderer.cpp
          grep -F 'skinningMatrix.data()' src/gameLayer/rendering/renderer.cpp
          grep -F 'static_cast<GLsizei>(entityData.size())' src/gameLayer/rendering/renderer.cpp
          ! grep -R -F 'shaders/postProcess/' src include
          grep -F 'caustics3.png' src/gameLayer/gameLayer.cpp
          ! grep -R -F 'texture2D(' resources/shaders
          ! grep -R -F 'void swap(in out float a, in out float b)' resources/shaders
          test -f resources/shaders/postprocess/drawQuads.vert
          test -f resources/assets/otherTextures/caustics3.png

      - name: Commit runtime fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gameLayer/rendering/renderer.cpp \
            src/gameLayer/gameLayer.cpp \
            resources/shaders
          if git diff --cached --quiet; then
            echo 'Runtime fixes already present.'
            exit 0
          fi
          git commit -m 'fix: prevent Linux world-create crash and repair Mesa shaders'
          git push origin HEAD:agent/linux-world-create-crash-fix
