name: Fix Flatpak GCC reset syntax

on:
  push:
    branches:
      - agent/release-packaging-stabilization
    paths:
      - .github/workflows/fix-flatpak-gcc-resets.yml

permissions:
  contents: write

jobs:
  fix-gcc-resets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-stabilization
          fetch-depth: 0
      - name: Apply minimal GCC portability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/gameLayer/multyPlayer/createConnection.cpp'): [
                  ('chunk->blockData.chestBlocks[blockHash] = {};',
                   'chunk->blockData.chestBlocks[blockHash] = ChestBlock{};'),
                  ('entityManager.players[entity->eid] = {};',
                   'entityManager.players[entity->eid] = PlayerClient{};'),
              ],
              Path('src/gameLayer/multyPlayer/enetServerFunction.cpp'): [
                  ('c.playerData.inventory = {};',
                   'c.playerData.inventory = PlayerInventory{};'),
                  ('serverProfiler = {};',
                   'serverProfiler = Profiler{};'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git diff --check
      - name: Commit source fix and remove temporary helper
        run: |
          rm .github/workflows/fix-flatpak-gcc-resets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameLayer/multyPlayer/createConnection.cpp src/gameLayer/multyPlayer/enetServerFunction.cpp .github/workflows/fix-flatpak-gcc-resets.yml
          git commit -m "Fix GCC default reset syntax for Flatpak build"
          git push origin HEAD:agent/release-packaging-stabilization
